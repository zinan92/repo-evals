  statement: |
    Pushed within 90 days.
  business_expectation: |
    Anti-bot / API drift on the 6 platforms tracked stays current.
  status: passed
  last_run: runs/2026-05-06/run-static-checks
  note: 'GitHub API: pushedAt=2026-04-13 (~23 days ago). Solidly active.'
- id: claim-006
  title: Live e2e — actually read content from at least one platform via the CLI
  source: README "give your AI agent eyes"
  source_ref: agent_reach/
  priority: critical
  area: end-to-end
  statement: |
    Install the CLI, configure for one platform (e.g., X), run a search
    or thread-fetch query, verify content comes back parseable. Repeat
    per platform when relying on it.
  business_expectation: |
    "Read the entire internet" claim works against today's platforms,
    not yesterday's API surfaces.
  evidence_needed: |
    Needs platform-specific access (some platforms allow public reads,
    others need cookies/tokens). One happy-path read per platform of
    interest + one error case (rate-limit, missing auth).
  status: untested
- id: claim-007
  title: Zero API fees claim — uses public-web access not paid APIs
  source: README "zero API fees"
  source_ref: agent_reach/
  priority: high
  area: cost-architecture
  statement: |
    Implementation uses public-web scraping or public-only API endpoints
    (no Twitter API paid tier, no YouTube Data API quota burn, etc.).
  business_expectation: |
    Cost is your own time + occasional anti-bot tax — not a per-query
    SaaS bill.
  status: passed_with_concerns
  last_run: runs/2026-05-06/run-static-checks
  note: |
    Confirmed README claim ("zero API fees"). Real implementation
    likely uses public scraping / cookie-auth + may run into anti-bot
    on some platforms (Twitter / X especially after 2023 changes).
    "Zero API fees" is true but "stable forever" is not — concern is
    on durability not pricing.
