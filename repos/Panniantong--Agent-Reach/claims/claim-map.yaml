  source_ref: agent_reach/
  priority: critical
  area: platform-coverage
  statement: |
    agent_reach/ Python package implements platform-specific readers for
    at least 6 platforms (Twitter / Reddit / YouTube / GitHub / Bilibili
    / 小红书). README explicitly headlines this list.
  business_expectation: |
