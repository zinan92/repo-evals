workflow_diagram:
  layout: linear
  why_layer:
    en: |
      Molecule — fixed pipeline (URL/query → platform identify → per-platform reader → structured result). Per-platform handlers are atoms; the CLI router is the orchestrator. No LLM-runtime routing.
    zh: |
      分子 —— 固定流水线(URL/查询 → 平台识别 → 各平台 reader → 结构化结果)。各平台 handler 是原子;CLI 路由是编排器。运行时无 LLM 路由。
  nodes:
  - id: input
    type: start
    rank: 0
    lane: 0
    label:
      en: |-
        Query / URL
        from agent
      zh: |-
        查询 / URL
        从 agent 来
  - id: identify
    type: atom
    rank: 1
    lane: 0
    label:
      en: |-
        Platform identify
      zh: |-
        平台识别
  - id: auth
    type: atom
    rank: 2
    lane: 0
    label:
      en: |-
        Auth / cookie
        load
      zh: |-
        鉴权 / cookie
        加载
  - id: reader
    type: atom
    rank: 3
    lane: 0
    label:
      en: |-
        Per-platform reader
        (search / fetch)
      zh: |-
        各平台 reader
        (搜 / 抓)
  - id: structure
    type: atom
    rank: 4
    lane: 0
    label:
      en: |-
        Structured JSON
        for LLM
      zh: |-
        结构化 JSON
        给 LLM
  - id: out
    type: end
    rank: 5
    lane: 0
    label:
      en: |-
        Agent quotes /
        cites with sources
      zh: |-
        Agent 引用 /
        标来源
  edges:
  - {from: input, to: identify}
  - {from: identify, to: auth}
  - {from: auth, to: reader}
  - {from: reader, to: structure}
  - {from: structure, to: out}
