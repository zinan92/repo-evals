notes: |
  MIT-licensed Python CLI giving an AI agent "eyes" — read + search
  Twitter (X) / Reddit / YouTube / GitHub / Bilibili / 小红书 from
  one tool, no per-API fees. 19K stars, recently active. Quad-language
  README (zh / en / ja / ko).

  Architecture: agent_reach/ Python package + scripts/ + tests/ +
  docs/. Solid project hygiene: CONTRIBUTING + SECURITY + CHANGELOG
  + test.sh + uv.lock + constraints.txt + llms.txt + CLAUDE.md
  (agent integration).

  Live e2e (real-platform read) untested in this static eval.
  "Zero API fees" is real but anti-bot durability per platform is
  the running maintenance cost.

  Molecule: per-platform reader handlers + a CLI router. URL or
  query → platform identification → reader call → structured result.
  No LLM-runtime decision about which platform.
product_view:
  one_liner:
    en: |-
      Give your AI agent eyes to see the entire internet — one CLI to read & search Twitter / Reddit / YouTube / GitHub / Bilibili / 小红书. MIT-licensed, zero API fees, 19K stars.
    zh: |-
      给你的 AI agent 装上看互联网的眼睛 —— 一个 CLI 读 + 搜 Twitter / Reddit / YouTube / GitHub / B 站 / 小红书。MIT 协议,无 API 费,19K stars。
  persona:
    en: |-
      A creator / researcher / content strategist who needs their AI agent to ground its outputs in actual current internet content. Typical: a writer wanting trending topic intelligence, a researcher tracking a discussion across platforms, an analyst doing competitive content analysis.
    zh: |-
      要让 AI agent 基于真实当前互联网内容回答的创作者 / 研究者 / 内容策略师。典型: 想要热点选题情报的写作者、跨平台跟踪讨论的研究者、做竞品内容分析的分析师。
  scenario:
    en: |-
      You ask your AI: "What are people saying about <topic> on X / Reddit / YouTube right now?". Without a tool like this the agent fabricates or refuses. With Agent-Reach the agent runs real searches and returns sourced summaries.
    zh: |-
      你问 AI: "现在 X / Reddit / YouTube 上大家在怎么聊 <某话题>?"。没有这种工具,agent 要么编要么拒绝。有了 Agent-Reach,agent 真去搜,拿带来源的总结回来。
  without_this:
    en: |-
      Three options. (1) Manually browse each platform — slow + you miss cross-platform signals. (2) Pay platform APIs (Twitter API paid tier alone is $100+/mo) — costs add up fast across platforms. (3) Wire individual scrapers per platform yourself — multi-week project, ongoing maintenance.
    zh: |-
      三条路。(1) 手动逐平台浏览 —— 慢 + 跨平台信号会丢。(2) 付各平台 API 费(单 Twitter API 付费档就 $100+/月) —— 跨平台累加很快。(3) 自己写各平台的爬虫 —— 几周项目 + 持续维护。
  with_this:
    en: |-
      One CLI install. Agent invokes it for any of the 6 platforms. Public-web access — no API fee tier needed. Returns structured results the LLM can quote / cite / link from. Multi-lang docs make it adoptable across regions.
    zh: |-
      一个 CLI 装一次。agent 在 6 个平台之间调它。走公开 web —— 不要付费档 API。返回结构化结果让 LLM 引用 / 标来源 / 链接。多语言文档跨区域好用。
  cost_summary:
    en: |-
      MIT, free. No API fee tier needed. Cost is anti-bot drift per platform — Twitter / X especially churns post-2023, so durability not stability. Your agent's normal LLM cost still applies.
    zh: |-
      MIT 免费。不要付费档 API。成本是各平台反爬漂移 —— 尤其 Twitter / X 在 2023 年后 churn 很猛,看持久性不是稳定性。你 agent 平常的 LLM 成本照算。
  how:
    en: |-
      Clone + `uv sync` (uv.lock present). Configure platform-specific auth where needed (cookies for X, GitHub token, etc.). Hand the CLI to your AI agent — for instance via Claude Code skill or Codex tool registration; CLAUDE.md + llms.txt help. Agent invokes it on demand for searches / fetches. Results come back as structured JSON the LLM consumes.
    zh: |-
      Clone + `uv sync`(有 uv.lock)。需要的平台配鉴权(X 用 cookie / GitHub token 等)。把 CLI 交给你的 AI agent —— 比如 Claude Code skill 或 Codex tool 注册;CLAUDE.md + llms.txt 有指引。Agent 按需调它做搜索 / 抓取。返回结构化 JSON 让 LLM 消费。
  watch_out:
    en: |-
      "Zero API fees" is true at sign-up time; durability per platform varies. Twitter / X surface in particular is hostile to public reads since the 2023 API changes — expect to maintain auth / cookie state. CHANGELOG indicates active maintenance, but you still want to monitor when a platform breaks. Live e2e never logged in this eval; spot-check the platforms you depend on.
    zh: |-
      "无 API 费"在注册时是真的;各平台持久性看天分。X 在 2023 年 API 改了之后对公开读取很敌对 —— 准备维护鉴权 / cookie。CHANGELOG 看维护活跃,但平台坏了你还是要盯。本次评测没记录端到端跑通;依赖的平台先抽测。
  examples:
  - context:
      en: |-
        A creator researching what people are saying about Sora 2 across X + Reddit + YouTube
      zh: |-
        在 X + Reddit + YouTube 上研究"大家怎么聊 Sora 2"的创作者
    you_say:
      en: |-
        Tell my AI agent to use agent-reach to search Twitter, Reddit, and YouTube for "Sora 2" mentions in the last 7 days, summarise the top sentiments + concerns
      zh: |-
        让 AI agent 用 agent-reach 在 Twitter / Reddit / YouTube 搜近 7 天 "Sora 2" 的提及,总结主流情绪 + 担忧
    what_happens:
      en: |-
        Agent invokes 3 platform reads concurrently. Each returns posts + comments + view counts. Agent synthesises a bilingual summary with source links per claim. Total latency 30-60 seconds; cost = your LLM's own price (the reads themselves are free).
      zh: |-
        Agent 并行调 3 个平台读取。各家返回帖子 + 评论 + 阅读数。Agent 综合成一份带来源链接的双语总结。总延迟 30-60 秒;成本是你 LLM 的价格(读取本身免费)。
  - context:
      en: |-
        A researcher cross-tracking how a GitHub release was discussed on Twitter
      zh: |-
        跨追踪 GitHub release 在 Twitter 上怎么被讨论的研究者
    you_say:
      en: |-
        agent-reach github release zinan92/repo-evals && agent-reach twitter search "repo-evals"
      zh: |-
        agent-reach github release zinan92/repo-evals && agent-reach twitter search "repo-evals"
    what_happens:
      en: |-
        First call returns the GitHub release notes + reaction counts. Second call returns Twitter posts that mention "repo-evals" + their engagement. Together: cross-platform sentiment without paying for two APIs.
      zh: |-
        第一个调用返回 GitHub release notes + 反应数。第二个返回 Twitter 上提到 "repo-evals" 的帖子 + 互动。组合起来: 跨平台情绪,不要付两份 API 钱。
  - context:
      en: |-
        A 小红书 trend-tracker doing weekly competitive analysis
      zh: |-
        每周做小红书竞品分析的趋势追踪者
    you_say:
      en: |-
        agent-reach xhs search "AI 短视频" --recent 7d
      zh: |-
        agent-reach xhs search "AI 短视频" --recent 7d
    what_happens:
      en: |-
        CLI reads recent 小红书 posts matching the keyword. Returns post bodies + image-deck content + engagement counts. Feed into your weekly analysis pipeline. No 小红书 API needed.
      zh: |-
        CLI 读最近 7 天匹配关键词的小红书帖子。返回正文 + 图文 + 互动数。喂给你的周度分析 pipeline。不要小红书 API。
  next_step:
    en: |-
      Run one logged read per platform you'll actually depend on (start with X since post-2023 it's the most fragile). Save the JSON output + any rate-limit / auth notes. Closes claim-006 (live e2e) for those platforms. Plus: check CHANGELOG cadence — a fast-iteration release pipeline is the maintenance signal that anti-bot drift is being handled.
    zh: |-
      给你真的会依赖的每个平台跑一次有日志的读取(先 X,2023 年后它最脆)。保存 JSON 输出 + rate-limit / 鉴权 notes。关掉那些平台的 claim-006(端到端)。再: 看 CHANGELOG 节奏 —— 快迭代 release 是反爬漂移被处理的信号。
