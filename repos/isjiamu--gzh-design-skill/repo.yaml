# === Internal architecture (Atom / Molecule / Compound) ======================
workflow_diagram:
  layout: linear
  why_layer:
    en: "Fixed sequential pipeline. The LLM fills content and makes local style decisions (theme pick, which keywords to underline) but performs no runtime sub-agent routing or plan generation — that makes it a molecule, not a compound. The two validators are embedded deterministic atoms that gate the output."
    zh: "固定顺序 pipeline。LLM 只做内容填充与局部风格判断（选主题、标哪些关键词），运行时不做子 agent 路由或计划生成——所以是 molecule 而非 compound。两个校验脚本是嵌入的确定性 atom，为产物把关。"
  nodes:
    - id: input
      type: start
      rank: 0
      lane: 0
      label:
        en: "Markdown / docx / pdf / txt"
        zh: "Markdown / docx / pdf / 纯文本"
    - id: normalize
      type: step
      rank: 1
      lane: 0
      label:
        en: "Normalize to Markdown"
        zh: "格式归一化为 Markdown"
    - id: theme
      type: step
      rank: 2
      lane: 0
      label:
        en: "Recommend + pick theme"
        zh: "推荐并选定主题"
    - id: assemble
      type: step
      rank: 3
      lane: 0
      label:
        en: "Assemble HTML from component library"
        zh: "按组件库装配 HTML"
    - id: validate
      type: decision
      rank: 4
      lane: 0
      label:
        en: "component_lint + validate_gzh_html (0 ERROR?)"
        zh: "component_lint + validate_gzh_html（0 ERROR？）"
    - id: preview
      type: step
      rank: 5
      lane: 0
      label:
        en: "wrap_preview → one-click copy page"
        zh: "wrap_preview → 一键复制预览页"
    - id: output
      type: end
      rank: 6
      lane: 0
      label:
        en: "Paste-ready WeChat section"
        zh: "可粘贴的公众号 section"
  edges:
    - {from: input, to: normalize}
    - {from: normalize, to: theme}
    - {from: theme, to: assemble}
    - {from: assemble, to: validate}
    - {from: validate, to: preview}
    - {from: preview, to: output}

# === Comparison ==============================================================
similar_repos:
  - slug: "geekjourneyx--md2wechat-skill"
    shared_purpose:
      en: "Convert Markdown into WeChat-editor-ready HTML."
      zh: "把 Markdown 转成公众号编辑器可用的 HTML。"
    this_better_at:
      en: "Design richness (6 thick themed component libraries + a theme generator), agent-native (any agent just reads SKILL.md — no binary), and dual deterministic compliance gates. Zero third-party deps."
      zh: "设计丰富度（6 套厚主题组件库 + 主题生成器）、agent 原生（任何 agent 直接读 SKILL.md，无需二进制）、双确定性合规关卡。零第三方依赖。"
    other_better_at:
      en: "A compiled Go CLI (atom) with 228 tests and 5 JSON discovery commands — more deterministic single-command conversion, higher test coverage, and it can also WRITE (humanize / write-from-idea) whereas gzh-design deliberately only formats."
      zh: "编译型 Go CLI（atom），228 个测试 + 5 个 JSON discovery 命令——单命令转换更确定、测试覆盖更高，且能「写」（humanize / 从想法直接写），而 gzh-design 刻意只排版不写作。"
