  # --- CORE layer (LLM-driven assembly — the molecule promise) -----------

  - id: claim-010
    user_icon: "🎯"
    user_title:
      en: "Markdown in → themed, paste-safe WeChat HTML out (validated)"
      zh: "Markdown 进 → 主题化、粘贴安全的公众号 HTML 出（过校验）"
    user_description:
      en: "The core promise: following SKILL.md with a real theme library, an agent assembles a themed section that passes the validator at 0 ERROR. Verified firsthand in a live run."
      zh: "核心承诺：按 SKILL.md + 真实主题库，agent 装配出过校验 0 ERROR 的主题化 section。本次评估亲手 live run 验证。"
    title: 核心 molecule 承诺：md → 合规主题化 HTML
    source: README
    source_ref: "使用流程 / 核心特性"
    priority: critical
    area: core
    statement: |
      按 SKILL.md 用某套主题库把 Markdown 装配成 section，产物过 validate_gzh_html.py
      达 0 ERROR / 0 半角 WARN。
    evidence_needed: |
      实际驱动一次装配并对自产物运行产物关校验。
    status: passed
    evidence: |
      LIVE E2E：读 theme-moyu-green.md，按 SKILL.md 把 sample-article.md 的
      「Skill 是能力商品」节装配成 section（编号章节 + 逐段关键词下划线 + 绿色加粗 + 黄色高亮，
      全 span leaf 包裹、全角标点）；自产物过 validate_gzh_html.py → 0 ERROR / 0 WARN /
      13 leaf wraps，退出 0。molecule 核心层已实测 → core_layer_tested 抬升。

  - id: claim-011
    user_icon: "🎣"
    user_title:
      en: "Fires on WeChat-formatting intent, not on web/PPT asks"
      zh: "公众号排版意图才触发，不误触网页/PPT"
    user_description:
      en: "SKILL.md description + eval-cases.md define explicit positive/negative trigger sets (公众号/微信排版/gzh yes; landing page/PPT/write-an-article no)."
      zh: "SKILL.md description + eval-cases.md 定义了明确的正/反例触发集（公众号/微信排版/gzh 触发；落地页/PPT/写文章 不触发）。"
    title: 触发精度设计
    source: SKILL.md
    source_ref: "description / eval-cases.md"
    priority: high
    area: core-triggering
    statement: |
      在公众号排版类 query 上触发、在网页/PPT/写作类 query 上不触发。
    evidence_needed: |
      trigger_test.py 的 precision/recall；或 eval-cases 静态核对。
    status: passed_with_concerns
