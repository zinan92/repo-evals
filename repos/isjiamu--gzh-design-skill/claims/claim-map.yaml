  - id: claim-014
    user_icon: "🔁"
    user_title:
      en: "Consistent output across models (换模型不走样)"
      zh: "跨模型输出一致（换模型不走样）"
    user_description:
      en: "Because formatting logic lives in component libraries + scripts, the README claims Claude / GPT / Gemini / domestic models all produce consistent results."
