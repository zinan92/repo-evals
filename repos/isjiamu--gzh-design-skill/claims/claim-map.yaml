# Claim map for gzh-design-skill (hybrid-skill).
# SUPPORT layer = deterministic scripts (fully testable statically).
# CORE layer = LLM-driven assembly (molecule; needs live e2e).
# Statuses reflect the 2026-07-09 eval — see runs/2026-07-09/ for evidence.

claims:
  # --- SUPPORT layer (deterministic code) --------------------------------

  - id: claim-001
    user_icon: "🛡"
    user_title:
      en: "Blocks WeChat-illegal HTML deterministically"
      zh: "确定性拦截公众号会过滤的写法"
    user_description:
      en: "A script — not the model's memory — flags <style>/<div>/class/id/position/grid/CSS-vars/external-fonts that WeChat strips or breaks on paste."
      zh: "由脚本（而非模型记性）检出 <style>/<div>/class/id/position/grid/CSS 变量/外部字体等公众号会过滤或粘贴后失效的写法。"
    title: validate_gzh_html.py 确定性检出平台禁用项
    source: README
    source_ref: "双关卡质量校验 / 平台红线"
    priority: critical
    area: support-validation
    statement: |
      对含禁用标签/属性/样式的 HTML，validate_gzh_html.py 报 ERROR 并退出码 1。
    evidence_needed: |
      对故意不合规 HTML 运行脚本，观察 ERROR 计数与退出码。
    status: passed
    evidence: |
      TEST C：<div class><style> + 未包裹中文 → 4 ERROR，退出 1。检出真实生效。

  - id: claim-002
    user_icon: "📌"
    user_title:
      en: "Enforces the <span leaf> wrap that keeps styles on paste"
      zh: "强制 <span leaf> 包裹——粘贴后样式不掉的关键"
    user_description:
      en: "The #1 reason WeChat styles vanish on paste is missing <span leaf=\"\"> wrapping. The validator catches unwrapped CJK text so the output survives."
      zh: "公众号粘贴后样式整片丢失，最常见就是漏了 <span leaf=\"\"> 包裹。校验器专门抓未包裹的中文文本，保证产物不塌。"
    title: 校验器强制 span leaf 包裹
    source: SKILL.md
    source_ref: "平台红线 / Gotchas"
    priority: critical
    area: support-validation
    statement: |
      全文无 span leaf 时报 ERROR；部分中文未包裹时报 WARNING 并给出片段。
    evidence_needed: |
      对无包裹 HTML 与已包裹 HTML 分别运行，比较结论。
    status: passed
    evidence: |
      TEST C：全文无 leaf → ERROR。TEST B：随包 moyu-green.html 122 处 leaf → 合规。

  - id: claim-003
    user_icon: "✅"
    user_title:
      en: "Passes clean HTML; half-width punctuation is a warning, not a block"
      zh: "合规 HTML 直接放行；半角标点是 warning 不是 error"
    user_description:
      en: "Compliant output exits 0. Half-width punctuation after Chinese is surfaced as a WARNING (fix-before-ship) rather than a hard failure — matches the documented design."
      zh: "合规产物退出 0。中文后的半角标点作为 WARNING 提示（交付前修）而非硬失败——与文档设计一致。"
    title: 合规放行 + 半角标点分级为 WARNING
    source: SKILL.md
    source_ref: "第 5 步 校验"
    priority: high
    area: support-validation
    statement: |
      合规 HTML 退出 0；中文后半角 ,;!? 与 ASCII 引号报 WARNING。
    evidence_needed: |
      对合规 HTML 与含半角标点 HTML 分别运行。
    status: passed
    evidence: |
      TEST D：合规 → 退出 0。TEST D2：半角标点 → WARNING、退出 0。

  - id: claim-004
    user_icon: "📐"
    user_title:
      en: "Ships component libraries that pass their own source lint"
      zh: "随包组件库自身过源头 lint（0 ERROR）"
    user_description:
      en: "component_lint.py scans every theme library's html blocks for anti-patterns (white-space:pre, forbidden tags). All shipped libraries pass at 0 ERROR."
      zh: "component_lint.py 扫每套主题库的 html 块查反模式（white-space:pre、禁用标签）。随包所有库 0 ERROR。"
    title: 组件库源头 lint 0 ERROR
    source: README
    source_ref: "可验证循环 / 源头关"
    priority: critical
    area: support-components
    statement: |
      component_lint.py 扫 references/ 所有组件库，ERROR 计数为 0、退出 0。
    evidence_needed: |
      对仓库 references/ 运行 component_lint.py。
    status: passed
    evidence: |
      TEST A：11 个库，0 ERROR，退出 0（2 WARN 为主题特征虚线组件，脚本按 CENTERED 豁免规则容许）。

  - id: claim-005
    user_icon: "🖼"
    user_title:
      en: "Shipped gallery output is actually paste-safe (not just claimed)"
      zh: "随包 gallery 产物是真合规（不是嘴上说）"
    user_description:
      en: "The bundled docs/gallery/*.html are genuine pipeline outputs and pass the validator — proof the pipeline has produced compliant artifacts, not just promises."
      zh: "随包 docs/gallery/*.html 是真实 pipeline 产物且过校验——证明 pipeline 真能产出合规产物，不是空头承诺。"
    title: 随包 gallery 产物过产物关
    source: README
    source_ref: "效果预览 / docs/gallery"
    priority: high
    area: support-artifacts
    statement: |
      docs/gallery/moyu-green.html 过 validate_gzh_html.py，完全合规。
    evidence_needed: |
      对随包 gallery HTML 运行产物关校验。
    status: passed
    evidence: |
      TEST B：moyu-green.html 122 leaf wraps，完全合规，退出 0。

  - id: claim-006
    user_icon: "🪶"
    user_title:
      en: "docx ingestion needs zero third-party libraries"
      zh: "docx 解析零第三方库"
    user_description:
      en: "extract_docx.py parses .docx with only the Python stdlib (zipfile + xml). No python-docx install, no version hell — trivially portable."
      zh: "extract_docx.py 只用 Python 标准库（zipfile + xml）解析 .docx。无需装 python-docx，无依赖地狱——极易移植。"
    title: extract_docx.py 仅用 stdlib
    source: SKILL.md
    source_ref: "格式归一化"
    priority: medium
    area: support-ingest
    statement: |
      extract_docx.py 的 import 全部为标准库。
    evidence_needed: |
      AST 解析脚本 import 列表。
    status: passed
    evidence: |
      TEST F：imports = argparse, os, re, sys, xml, zipfile（全 stdlib）。

  - id: claim-007
    user_icon: "📋"
    user_title:
      en: "One-click 'copy into WeChat' preview page"
      zh: "一键「复制到公众号」预览页"
    user_description:
      en: "wrap_preview.py wraps the clean section in a preview shell with a copy button (execCommand) — click once, paste into WeChat, no manual select-all. The button/JS stay outside the copied section."
      zh: "wrap_preview.py 把干净 section 包进带复制按钮（execCommand）的预览外壳——点一下即复制、直接粘公众号，免手动全选。按钮/JS 不在被复制的 section 内。"
    title: wrap_preview.py 生成一键复制预览页
    source: README
    source_ref: "一键复制"
    priority: high
    area: support-preview
    statement: |
      wrap_preview.py 产出含「复制到公众号」按钮 + 剪贴板逻辑的预览页。
    evidence_needed: |
      运行脚本并检查产物含复制按钮与剪贴板调用。
    status: passed
    evidence: |
      TEST E：产物含「复制到公众号」+ execCommand。按钮在预览外壳、不在 section 内。

  - id: claim-008
    user_icon: "🔗"
    user_title:
      en: "SKILL.md references all resolve"
      zh: "SKILL.md 引用全部解析得到"
    user_description:
      en: "Every path SKILL.md points at (theme-index, theme-*.md, common-components, format-normalize, eval-cases, scripts) exists — the agent won't hit a missing file."
      zh: "SKILL.md 引用的每个路径（theme-index、theme-*.md、common-components、format-normalize、eval-cases、scripts）都真实存在——agent 不会撞空文件。"
    title: SKILL.md 引用完整性
    source: SKILL.md
    source_ref: ""
    priority: high
    area: support-skill-integrity
    statement: |
      SKILL.md 引用的 references/ 与 scripts/ 路径均存在于仓库。
    evidence_needed: |
      比对 SKILL.md 引用与仓库文件树。
    status: passed
    evidence: |
      文件树核对：theme-index.md、6 套 theme-*.md、common-components.md、format-normalize.md、
      theme-generator.md、eval-cases.md、4 个 scripts 全部存在。

