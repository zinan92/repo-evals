<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gzh_e2e_out · 公众号排版预览</title>
<style>
  body{margin:0;background:#eef0f2;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;-webkit-text-size-adjust:100%;}
  .gzh-toolbar{position:fixed;top:0;left:0;right:0;height:54px;background:#ffffff;box-shadow:0 1px 10px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:99;}
  .gzh-hint{font-size:13px;color:#6b7280;line-height:1.4;}
  .gzh-hint b{color:#111827;}
  .gzh-copy{background:#059669;color:#fff;border:0;border-radius:9px;padding:10px 20px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(5,150,105,.28);white-space:nowrap;transition:transform .08s,background .15s;}
  .gzh-copy:hover{background:#047857;}
  .gzh-copy:active{transform:translateY(1px);}
  .gzh-toast{position:fixed;top:66px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 20px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:88vw;text-align:center;}
  .gzh-toast.show{opacity:1;}
  .gzh-stage{max-width:700px;margin:78px auto 64px;padding:0 8px;}
  @media(max-width:520px){.gzh-hint{max-width:150px;}}
</style>
</head>
<body>
<div class="gzh-toolbar">
  <span class="gzh-hint">👇 下方是排版效果 · 点右侧 <b>复制</b> 直接粘到公众号</span>
  <button class="gzh-copy" id="gzhCopyBtn" onclick="gzhCopy()">📋 复制到公众号</button>
</div>
<div class="gzh-toast" id="gzhToast"></div>
<div class="gzh-stage">
  <div id="gzh-content">
<section style="max-width:677px;margin:0 auto;background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;color:#374151;line-height:1.75;letter-spacing:0.5px;overflow-x:hidden;">
  <section style="margin-top:16px;margin-bottom:32px;padding:0 20px;">
    <section style="display:flex;align-items:center;gap:16px;margin-bottom:24px;">
      <section style="text-align:center;flex-shrink:0;">
        <p style="margin:0;font-size:28px;font-weight:900;color:#059669;line-height:1;letter-spacing:-2px;">
          <span leaf="">01</span>
        </p>
        <p style="margin:0;font-size:8px;font-weight:700;color:#D1D5DB;letter-spacing:2px;">
          <span leaf="">PART</span>
        </p>
      </section>
      <span style="width:1px;height:36px;background:#E5E7EB;flex-shrink:0;"><span leaf=""><br></span></span>
      <section>
        <p style="margin:0 0 1px;font-size:17px;font-weight:900;color:#111827;letter-spacing:0.3px;">
          <span leaf="">Skill 是能力商品</span>
        </p>
        <p style="margin:0;font-size:11px;font-weight:600;color:#9CA3AF;letter-spacing:1.5px;">
          <span leaf="">SKILL AS CAPABILITY · 能力商品</span>
        </p>
      </section>
    </section>
    <p style="margin-bottom:16px;font-size:14px;line-height:1.9;text-align:justify;">
      <span leaf="">我现在对 Skill 的一句话定义是：把专家经验、工作流、品味和工具调用，封装成</span><span style="border-bottom:2px solid #A7F3D0;font-weight:600;"><span leaf="">可分发、可复用、可迭代的能力单元</span></span><span leaf="">。</span>
    </p>
    <p style="margin-bottom:16px;font-size:14px;line-height:1.9;text-align:justify;">
      <span leaf="">它不是单纯的提示词，也不是传统意义上的 App，更像 Agent 时代的</span><strong style="color:#059669;"><span leaf="">能力商品</span></strong><span leaf="">。用户不需要理解底层的 MCP、CLI、loop，只需要知道：</span><span style="background:linear-gradient(120deg,#FDE68A 0%,rgba(255,255,255,0) 100%);padding:0 4px;border-radius:2px;font-weight:600;color:#111827;"><span leaf="">它解决什么问题，产出什么结果</span></span><span leaf="">。</span>
    </p>
  </section>
</section>
  </div>
</div>
<script>
  function gzhShowToast(msg){
    var t=document.getElementById('gzhToast');
    t.textContent=msg;t.classList.add('show');
    clearTimeout(t._timer);
    t._timer=setTimeout(function(){t.classList.remove('show');},2800);
  }
  function gzhCopy(){
    var el=document.getElementById('gzh-content');
    // 选中渲染后的富文本节点并复制（等价于手动 Ctrl+A / Ctrl+C，保留全部样式）
    var range=document.createRange();
    range.selectNodeContents(el);
    var sel=window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    var ok=false;
    try{ok=document.execCommand('copy');}catch(e){ok=false;}
    sel.removeAllRanges();
    var btn=document.getElementById('gzhCopyBtn');
    if(ok){
      gzhShowToast('✅ 已复制！去公众号编辑器按 Ctrl/⌘+V 粘贴即可');
      var old=btn.textContent;btn.textContent='✅ 已复制';
      setTimeout(function(){btn.textContent=old;},2200);
    }else{
      gzhShowToast('⚠ 自动复制失败，请手动全选(Ctrl/⌘+A)再复制(Ctrl/⌘+C)');
    }
  }
</script>
</body>
</html>
