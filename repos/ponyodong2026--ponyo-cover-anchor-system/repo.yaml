        zh: "$cover-anchor-system，用数字型给「5个AI视频提示词公式」做封面。"
      what_happens:
        en: "Picks 数字型, sets a giant-number anchor + tech-neon palette with HEX values + 3-level type hierarchy, and emits a finished 3:4 ChatGPT Image 2 prompt with exact Chinese copy and an 80px-thumbnail readability check."
        zh: "选数字型，定大号数字锚点 + 科技渐变配色（附 HEX）+ 三级字重层级，产出带准确中文、含 80px 缩略图可读性卡点的成品 3:4 生图提示词。"
    - context:
