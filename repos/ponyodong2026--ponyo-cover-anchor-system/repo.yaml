        zh: "一张点击率上不去的旧封面。"
      you_say:
        en: "Diagnose this cover."
        zh: "诊断一下这张封面。"
      what_happens:
        en: "Scores it 1-10 on information density / visual anchor / thumbnail readability / color contrast / trust, returns the top-3 fixes and a ready-to-use replacement finished-cover prompt."
        zh: "对信息密度/视觉锚点/缩略图可读性/色彩对比/信任感各打 1-10 分，给出前 3 项修改 + 一条可直接用的替换成品封面提示词。"
    - context:
        en: "A travel-vlog note that wants a photographic lifestyle cover (not a graphic card)."
        zh: "一篇想要真实照片感 lifestyle 封面（而非图形卡片）的旅行 vlog 笔记。"
      you_say:
        en: "Doodle-outline fresh cover for 周末逃跑计划."
        zh: "给「周末逃跑计划」做涂鸦描边小清新封面。"
      what_happens:
        en: "Emits a real-photo base + thick white doodle-outline + handwritten-sticker headline 3:4 prompt — a lifestyle-photography look HTML/CSS card systems structurally cannot produce."
        zh: "产出真实照片底 + 厚白涂鸦描边 + 手写贴纸标题的 3:4 提示词——这种实拍 lifestyle 观感是 HTML/CSS 卡片系统结构上做不出来的。"
  next_step:
    en: "(1) Get a license from the author (issue / email) — until then adoption is legally blocked; this is the #1 gate, not a scoring nicety. (2) Render 2+ live covers through ChatGPT Image 2 and score them against the SKILL.md Quality Bar (80px thumbnail readable, one dominant anchor, crisp correct Chinese) → lifts core_layer_tested + evidence partial→portable. (3) For 公众号 use, either author a real finished 公众号 3:1 + 1:1 template, or default 公众号 to guizang-social-card and scope ponyo to the 小红书 lane only."
    zh: "(1) 向作者要授权（issue / 邮件）——在此之前采用在法律上被卡死，这是第一关，不是评分小事。(2) 用 ChatGPT Image 2 真出 2+ 张封面，对照 SKILL.md Quality Bar（80px 缩略图可读、单一主锚点、中文清晰无误）打分 → 抬升 core_layer_tested + 证据 partial→portable。(3) 若要用于公众号：要么补真正的成品公众号 3:1 + 1:1 模板，要么公众号默认用 guizang-social-card、把 ponyo 限定在小红书 lane。"

# === Deployment ==============================================================
deployment:
  installable: true
  install_methods:
    - method: "Copy the cover-anchor-system folder into ~/.codex/skills/cover-anchor-system"
      platform: "Codex (or any agent that reads SKILL.md)"
      complexity: easy
    - method: "Read cover-anchor-system/SKILL.md directly and use references/finished-cover-prompts.md"
      platform: "any agent"
      complexity: easy
  requires_compile: false
  works_offline_after_install: false   # the cover IMAGE requires an external image model
  auto_update: false

# === Third-party services ====================================================
third_party_services:
  - name: "ChatGPT Image 2 / DALL-E (OpenAI)"
    purpose: "Render the finished cover IMAGE from the prompt this skill emits — the skill produces prompts, not pixels."
    required: true
    api_key_needed: true
    signup_needed: true
    free_tier: false
    cost_note: "The whole point (a cover image) cannot be produced without a paid external image model. This eval had no credentials, so the core output layer was NOT verified. Cross-model portability (Gemini / domestic models) is also unverified."

