# === Internal architecture (Atom / Molecule / Compound) ======================
workflow_diagram:
  layout: linear
  why_layer:
    en: "Fixed prompt-assembly pipeline: identify content/platform → pick a template from the matrix → read the matching reference → emit a cover plan + a ready-to-use image prompt. The LLM makes local choices (which template, which palette) but performs no runtime sub-agent routing or plan generation — so the skill layer is a molecule, not a compound. Crucially, the user's real output — the cover IMAGE — is produced by an EXTERNAL image model (ChatGPT Image 2 / DALL-E) this eval had no credentials to run, so the core output layer is unverified (core_layer_tested=false). Static checks confirm the prompt library is coherent and complete; they cannot confirm the rendered cover is on-brand or high-hook. That is why it is NOT scored as an atom with auto core_layer_tested=true."
    zh: "固定的提示词装配 pipeline：识别内容/平台 → 从矩阵选模板 → 读对应 reference → 产出封面方案 + 可直接用的生图提示词。LLM 只做局部选择（选哪个模板、哪套配色），运行时不做子 agent 路由或计划生成——所以 skill 层是 molecule 而非 compound。关键在于：用户真正的产物——封面「图」——由外部图像模型（ChatGPT Image 2 / DALL-E）生成，本次评估无凭证运行，因此核心产物层未验证（core_layer_tested=false）。静态检查能确认提示词库自洽完整，但不能确认出图调性对、钩子强。这就是为什么不把它当 atom 自动记 core_layer_tested=true。"
  nodes:
    - id: input
      type: start
      rank: 0
      lane: 0
      label:
        en: "Topic + audience + platform + title"
        zh: "主题 + 人群 + 平台 + 标题"
    - id: template
      type: step
      rank: 1
      lane: 0
      label:
        en: "Pick template (选择矩阵)"
        zh: "从矩阵选模板"
    - id: reference
      type: step
      rank: 2
      lane: 0
      label:
        en: "Read reference (formulas / prompts / diagnosis)"
        zh: "读 reference（公式/提示词/诊断）"
    - id: prompt
      type: step
      rank: 3
      lane: 0
      label:
        en: "Emit cover plan + finished-image prompt"
        zh: "产出封面方案 + 成品生图提示词"
    - id: imagemodel
      type: decision
      rank: 4
      lane: 0
      label:
        en: "External image model (ChatGPT Image 2) — NOT run in this eval"
        zh: "外部图像模型（ChatGPT Image 2）— 本次评估未运行"
    - id: output
      type: end
      rank: 5
      lane: 0
      label:
        en: "Finished cover image (quality unverified)"
        zh: "成品封面图（质量未验证）"
  edges:
    - {from: input, to: template}
    - {from: template, to: reference}
    - {from: reference, to: prompt}
    - {from: prompt, to: imagemodel}
    - {from: imagemodel, to: output}

