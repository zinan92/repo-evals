# repo.yaml — ponyo-cover-anchor-system dossier
# Evaluated 2026-07-09 by Mark (Claude Code / claude-opus-4-8) for Park Agent OS.
# Feeds the Vera（视觉/配图 Manager）adoption decision for the 公众号 content pipeline.

# === Identity ================================================================
owner: ponyodong2026
repo: ponyo-cover-anchor-system
display_name: ponyo-cover-anchor-system · 波妞小红书强钩子爆款封面
repo_url: https://github.com/ponyodong2026/ponyo-cover-anchor-system

repo_type: skill
archetype: prompt-skill

# Fixed prompt-assembly pipeline (identify content/platform → pick template →
# read reference → emit cover plan + image prompt). The LLM makes local choices
# (which template, which palette) but does NO runtime sub-agent routing → not a
# compound. NOT an atom either: the real user output is a cover IMAGE rendered by
# an EXTERNAL image model (ChatGPT Image 2 / DALL-E) this eval cannot run, so the
# user-facing contract is NOT statically verifiable. → molecule, core untested.
layer: molecule

complexity: simple
uses_areas: false
status: evaluated
last_evaluated: "2026-07-09"
version_tested: "main@HEAD (2026-06-22 push), commit f03b7bc"

# === Maintainer / ecosystem signals (verified via gh api) ====================
stars: 134
archived: false
has_license: false         # ADOPTION FLAG. gh api license field = null AND
                           # /contents/LICENSE + /contents/LICENSE.md → 404.
                           # No license = all-rights-reserved: no legal grant to
                           # use / modify / redistribute. Not just a scoring ding.
multilingual_readme: false # single README.md mixes EN + ZH; no separate language file
release_pipeline_score: 0  # no releases, no tags, no CI, no changelog (1 push)
eval_discipline_score: 0   # no tests, no validators, no eval harness — pure prompt skill
recently_active: true      # created 2026-06-21, pushed 2026-06-22 — within 90d BUT a
                           # single 2-day burst 17 days ago, bus-factor 1 (see notes)

business_category: content
use_case_tags: ["xiaohongshu-cover", "social-cover-design", "visual-anchor", "image-prompt", "content-visual"]

notes: |
  波妞 PONYO 出品的 Codex prompt-skill：把「主题 + 人群 + 内容类型 + 标题」变成一条可直接
  粘进 ChatGPT Image 2 / DALL-E 的**成品小红书封面**提示词，建立在明确的「信息密度 × 视觉锚点」
  点击率模型上。134★ / 21 forks，仓库极年轻：2026-06-21 建、2026-06-22 一次推送后至今（17 天）
  无活动，单一 committer（Dong Ponyo），bus-factor 1，无 release / CI / 测试。

  静态实测（可验证、已通过）：
    - SKILL.md frontmatter 合法（name: cover-anchor-system + 富触发 description）。
    - SKILL.md 引用的 6 个 reference 文件全部存在（template-formulas / finished-cover-prompts /
      doodle-outline-fresh-style / sunlit-scrapbook-cutout-style / cover-diagnosis-checklist /
      image-prompts）。
    - README 承诺的 4 条工作流 + 6 套模板/风格在 references/ 里都有对应文件。
    - template-formulas.md 参数具体（4 套模板 HEX 配色、锚点位置、4.5:1 对比度阈值、
      数字占高 30-40%、字重比、80px 缩略图测试）；diagnosis-checklist 是可执行的 10 点打分表。
    - finished-cover-prompts.md 有 13 条成品封面提示词 + Universal Prompt Contract；
      两套 lifestyle 风格包（涂鸦描边 / 阳光胶片拼贴）各带 4 条 ready prompt。
    - anti-slop / 水印规则在 SKILL.md Quality Bar + 每个 style 文件里一致声明
      （无糊字、无假 logo/QR、无编造数据、默认不打「波妞/PONYO/@」水印）。
    - 随包 16 张示例 PNG（12 cover-cases + 4 doodle）+ 2 张预览图 —— 证明「能出图」。

  **未实测（核心，image-model-dependent）**：真正的用户产物是封面「图」，由外部图像模型
  （ChatGPT Image 2 / DALL-E）生成；本次评估无凭证、无法运行该模型，因此**封面出图的调性对不对、
  钩子强不强、中文字形糊不糊，全部未验证**。随包示例 PNG 只证明「产出存在」，不证明「稳定产好图」。
  → layer=molecule，core_layer_tested=false，evidence=partial。

  **平台真相（对 Park = 公众号 的关键）**：这是**小红书（3:4）系统**。finished-cover-prompts.md
  的 13 条成品提示词**全部写死 `3:4 vertical Xiaohongshu 1080x1440`，零条公众号 3:1 成品模板**；
  唯一的公众号 3:1 指引在 legacy `image-prompts.md`（无字背景 + 手动叠字），而 SKILL.md/README
  明确弃用该路径用于发布。对 Park 的公众号渠道适配差。

  **头对头**：op7418--guizang-social-card-skill（4809★ / AGPL-3.0）**显式产出公众号 21:9+1:1
  封面对**、走确定性 single-file HTML→PNG（无外部图模型、中文永远清晰、可复现），正是 Park 公众号
  要的东西 → 公众号 primary 应给 guizang；ponyo 至多是**小红书 lane 的 backup**，且须先拿到授权。

# === Product view ============================================================
product_view:
  one_liner:
    en: "A Codex prompt-skill that turns a topic + audience + title into a ready-to-paste ChatGPT Image 2 / DALL-E prompt for a finished, high-hook Xiaohongshu cover — built on an explicit 信息密度 × 视觉锚点 formula with 6 template/style families, a 10-point diagnosis checklist, and a 16-image example gallery. The cover image itself is produced by an external image model this eval cannot run."
    zh: "一个 Codex prompt-skill：把「主题 + 人群 + 标题」变成可直接粘进 ChatGPT Image 2 / DALL-E 的成品小红书封面提示词——建立在明确的「信息密度 × 视觉锚点」公式上，含 6 套模板/风格、10 点诊断清单、16 张示例图库。封面成品图由外部图像模型生成，本次评估无法运行该模型。"
  persona:
    en: "A content visual / cover-design lead (Park's Vera) who needs on-brand, thumb-stopping Xiaohongshu covers fast and hands image URLs to the downstream gzh-design formatting skill."
    zh: "需要快速产出强钩子、调性统一的小红书封面，并把图片 URL 交给下游 gzh-design 排版技能的配图/视觉负责人（Park 的 Vera）。"
  scenario:
    en: "You have a finished note and need a cover that makes people click in the feed within 3 seconds — you want the anchor, palette, type hierarchy, and a copy-paste image prompt decided for you."
    zh: "你有一篇成稿，需要一张能让人在信息流里 3 秒内点进来的封面——希望锚点、配色、字重层级和一条可复制的生图提示词都替你定好。"
  without_this:
    en: "Hand-brief an image model yourself (covers drift off-brand, Chinese text garbles, no anchor discipline), or design covers manually in Figma / Canva per post."
    zh: "自己手写生图指令（封面调性飘、中文易糊、没有锚点纪律），或每篇在 Figma / Canva 手动做封面。"
  with_this:
    en: "Say '$cover-anchor-system, 小红书 cover for <topic/title>' — it picks a template, fixes the anchor / palette / type hierarchy with HEX values, and emits a finished-cover ChatGPT Image 2 prompt with exact Chinese copy and an 80px-thumbnail quality bar."
    zh: "说「$cover-anchor-system，给<主题/标题>做小红书封面」——它选模板、用 HEX 定好锚点/配色/字重层级，产出带准确中文文案、含 80px 缩略图质量卡点的成品封面提示词。"
  cost_summary:
    en: "Repo is free to read but has NO LICENSE (all-rights-reserved — no legal grant to use / modify / redistribute). Actually rendering a cover needs an external PAID image model (ChatGPT Image 2 / DALL-E): API key / paid account required. The skill files themselves are plain text."
    zh: "仓库可免费阅读但无 LICENSE（保留所有权利——法律上未授予使用/修改/再分发权）。真正出图需外部付费图像模型（ChatGPT Image 2 / DALL-E）：需 API key / 付费账号。skill 文件本身是纯文本。"
  how:
    en: "Copy the cover-anchor-system folder into ~/.codex/skills/ (or read SKILL.md directly), then call it with topic / audience / title; take the emitted prompt to ChatGPT Image 2 / DALL-E to render the cover."
    zh: "把 cover-anchor-system 文件夹拷进 ~/.codex/skills/（或直接读 SKILL.md），用主题/人群/标题调用；把产出的提示词拿到 ChatGPT Image 2 / DALL-E 出图。"
  watch_out:
    en: "(1) NO LICENSE — all-rights-reserved; you have no legal right to adopt, fork, or redistribute it in Park's pipeline until the author grants one. (2) It is a 小红书 (3:4) system: all 13 finished-cover prompts hard-code 3:4 Xiaohongshu 1080x1440; there is NO finished 公众号 (3:1) template — the only 公众号 3:1 guidance lives in the legacy image-prompts.md text-free-background path, which SKILL.md itself deprecates for publishing. For Park's 公众号 channel this is a poor fit. (3) The cover IMAGE is produced by an external image model (ChatGPT Image 2 / DALL-E); output quality, on-brand-ness, and Chinese-text fidelity are model-dependent and were NOT verified here (no credentials) — the bundled example PNGs prove 'produces something,' not repeatable quality. (4) Very young, single-committer repo: created 2026-06-21, one push 2026-06-22, bus-factor 1, no releases / CI / tests."
    zh: "(1) 无 LICENSE——保留所有权利；作者授权前，你在法律上无权把它纳入 Park pipeline、fork 或再分发。(2) 这是小红书（3:4）系统：13 条成品封面提示词全部写死 3:4 小红书 1080x1440；没有成品公众号（3:1）模板——唯一的公众号 3:1 指引在被 SKILL.md 明确弃用的 image-prompts.md 无字背景路径里。对 Park 的公众号渠道适配差。(3) 封面成品图由外部图像模型（ChatGPT Image 2 / DALL-E）生成，出图质量/调性/中文字形依赖模型，本次评估未验证（无凭证）——随包示例 PNG 只能证明「能出图」，不能证明「稳定出好图」。(4) 极年轻、单人仓库：2026-06-21 建、2026-06-22 一次推送、bus-factor 1，无 release/CI/测试。"
  examples:
