    zh: validate-skill.sh（182 行）校验 frontmatter / Codex skill 对齐；security-scan.sh（88 行）；supply-chain-audit.sh（44 行）；还有 bootstrap-dev.sh / clean-local-runtime.sh —— 全在根 scripts/ 下，全是 POSIX shell。
