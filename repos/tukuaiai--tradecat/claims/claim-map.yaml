claims:
- id: claim-001
  title: 一键 curl|sh 安装脚本（重构后路径已迁移）真的能完成自检
  source: README "用户安装入口" + scripts/project/install.sh
  source_ref: scripts/project/install.sh
  priority: critical
  area: install
  user_icon: "📦"
  user_title:
    en: One-line curl|sh install actually works
    zh: 一行 curl|sh 真的能装上
  user_description:
    en: You can paste the install command from README and it sets up Python 3.12, deps, launcher, and cache without further reading.
    zh: README 里那条 curl|sh 抄过去敲下去就装完，不用再翻源码、不用再配什么。
  statement: |
    install.sh 必须是真实可执行的 sh 脚本（非占位），声明 PYTHON_VERSION=3.12，
    执行流程明确：检测 python 3.12 / fallback 到 uv / clone develop 分支 /
    pip install -e ".[dev]" / 写入 ~/.local/bin/tradecat / 初始化 .tradecat/cache。
    支持 TRADECAT_INSTALL_SKIP_SYNC + TRADECAT_INSTALL_SKIP_PATH_WRITE 两个 CI 跳过开关。
  business_expectation: 用户照 README 第一条命令敲下去，完成自检，不需要再读源代码。
  evidence_needed: install.sh 内容 + 关键变量 grep + 自检触发 verify.sh 流程。
  status: passed
  last_run: runs/2026-05-07/run-static-checks
  note: |
    288 行 POSIX shell（重构后从仓库根迁到 scripts/project/install.sh）；PYTHON_VERSION
    默认 3.12，可由 TRADECAT_PYTHON_VERSION 覆盖；TRADECAT_INSTALL_SKIP_SYNC 和
    TRADECAT_INSTALL_SKIP_PATH_WRITE 两个 CI 开关都在脚本里。
- id: claim-002
  title: dataset_registry.json 与 README 数据集声明对齐（now 2 workbooks）
  source: README + dataset_registry.json
  source_ref: scripts/project/src/tradecat_terminal/dataset_registry.json::datasets
  priority: critical
  area: dataset-coverage
  user_icon: "🗂"
  user_title:
    en: 4 datasets, all live, contract matches README
    zh: README 说的 4 个数据集，确实都还活着、contract 对得上
  user_description:
    en: market_snapshot / anomaly_panel / market_stats / event_stream all exist with active=true and the data_mode (snapshot/stream) matches what the README claims.
    zh: market_snapshot / anomaly_panel / market_stats / event_stream 都在 registry 里 active=true，前 3 个 snapshot 第 4 个 stream 跟 README 说的一致。
  statement: |
    README 声称 4 个数据集（market_snapshot / anomaly_panel / market_stats /
    event_stream）。registry 中必须存在这 4 个 entry 且 active=true，
    data_mode 字段对得上（前 3 个 snapshot，event_stream 是 stream），
    每个 dataset 都有 workbook_key + gid（Google Sheets 真实坐标）。
  business_expectation: 用户用 README 列出的任意 dataset 名调用 request.py 都能命中真实坐标。
  evidence_needed: registry dump + 4 个 dataset 的 active/data_mode 字段。
  status: passed
  last_run: runs/2026-05-07/run-static-checks
  note: |
    4 active datasets：market_snapshot / anomaly_panel / market_stats（snapshot, market_data
    workbook）+ event_stream（stream, alternative_data workbook）。新版改成 2 workbook 拆分
    设计，比上次评测时的设计更清晰；spreadsheet_id 全部存在。
- id: claim-003
  title: pyproject.toml 与 install.sh 的 Python 版本要求一致
  source: scripts/project/pyproject.toml + scripts/project/install.sh
  source_ref: requires-python + PYTHON_VERSION
  priority: high
  area: install-consistency
  user_icon: "🔗"
  user_title:
    en: Python version constraint matches end-to-end
    zh: 装的 Python 跟代码要求的 Python 是同一个
  user_description:
    en: install.sh defaults to Python 3.12, pyproject requires >=3.12, all 3 entry-points (tradecat / tradecat-terminal / tcat) exist as scripts.
    zh: install.sh 默认拉 3.12、pyproject 也要求 >=3.12、3 个 entry-point（tradecat / tradecat-terminal / tcat）都在 pyproject.scripts 真实存在。
  statement: |
    install.sh 默认 PYTHON_VERSION=3.12，pyproject.toml requires-python>=3.12。
    不出现 install 拉 3.12 而 pyproject 写 >=3.10 这种「装得上跑不通」；
    entry-points (`tradecat`、`tradecat-terminal`、`tcat`) 在 [project.scripts] 真实存在。
  business_expectation: install 拉的 Python 跟代码要求的 Python 是同一个，避免版本错配的玄学问题。
  evidence_needed: pyproject.toml + install.sh 的关键字段对照。
  status: passed
  last_run: runs/2026-05-07/run-static-checks
  note: install.sh 默认 3.12 ↔ pyproject requires-python ">=3.12" ↔ 3 个 entry-point 全部存在。
- id: claim-004
  title: 一次性请求脚本 (request.py) 能在不安装的情况下读 dataset
  source: README "一次性请求"
  source_ref: scripts/project/scripts/request.py
  priority: high
  area: cli-surface
  user_icon: "⚡️"
  user_title:
    en: Try it before you install (zero-install)
    zh: 装之前可以先试一下数据
  user_description:
    en: A single 191-line script reads the same dataset_registry.json as the installed CLI; supports --datasets / --meta / --headers flags; run via `python3 <(curl ...)` without cloning anything.
    zh: 一个 191 行的脚本，跟安装版共用同一份 dataset_registry.json；支持 --datasets / --meta / --headers；用 `python3 <(curl ...)` 不克隆就能跑。
  statement: |
    README 声称 `python3 <(curl -fsSL .../request.py) event_stream` 可以
    不克隆、不写缓存直接拿数据。`request.py` 需要存在、可独立执行、且与正式 CLI
    共享同一份 dataset_registry.json（README 明确说「与安装版使用同一个 dataset 契约」）。
  business_expectation: 新用户在评估期可以零安装试一下数据是否值得装。
  evidence_needed: request.py 内容 + 是否引用 dataset_registry.json + 是否有 --datasets / --meta / --headers 三种 mode。
  status: passed
  last_run: runs/2026-05-07/run-static-checks
  note: |
    191 行，引用同一份 dataset_registry.json（通过远程 raw URL）；--datasets / --meta /
    --headers 三个 flag 全部 grep 命中；与安装版共享 dataset 契约。
- id: claim-005
  title: TUI 在不支持 curses 的终端会优雅降级，不抛 traceback
  source: README "稳定终端" 段
  source_ref: scripts/project/src/tradecat_terminal/tui.py
  priority: high
  area: terminal-ux
  user_icon: "🪂"
  user_title:
    en: TUI degrades to plain text in restricted terminals
    zh: SSH / 浏览器终端不会抛 traceback
  user_description:
    en: tui.py defines TUI_FORCE_CURSES_ENV / TUI_ALLOW_WINDOWS_CURSES_ENV / render_safe_plain_tui / render_plain_fallback paths so unknown terminals fall through to plain text instead of crashing.
    zh: tui.py 里有 TUI_FORCE_CURSES_ENV / TUI_ALLOW_WINDOWS_CURSES_ENV 等环境变量分支和 render_safe_plain_tui / render_plain_fallback 降级路径；不支持 curses 的终端会走纯文本而不是崩溃。
  statement: |
    README 明确承诺「浏览器 Web 终端、未知 SSH 终端和未知 Windows 控制台会自动
    降级为静态文本模式，不再抛出 Python traceback」。tui.py 中存在 curses
    可用性探测 + plain-text fallback 路径，环境变量 override 全部存在。
  business_expectation: 用户在 SSH 或受限终端里跑 tradecat 不会看到一堆 Python 错误。
  evidence_needed: tui.py 关键代码片段（grep curses fallback、env var）+ CLI --plain flag 解析。
  status: passed
  last_run: runs/2026-05-07/run-static-checks
  note: |
    tui.py 1827 行（重构后体量翻倍），定义 TUI_FORCE_CURSES_ENV / TUI_ALLOW_WINDOWS_CURSES_ENV，
    render_safe_plain_tui + render_plain_fallback + _plain_mode_reason 完整链路存在；
    `--plain` 启动语义保持。
- id: claim-006
  title: 默认自动更新有节流，可被环境变量关闭
  source: README "启动时默认自动更新"
  source_ref: scripts/project/install.sh launcher
  priority: high
  area: update-policy
  user_icon: "🛑"
  user_title:
    en: Auto-update can be turned off
    zh: 自动更新可以关掉
  user_description:
    en: TRADECAT_NO_AUTO_UPDATE=1 disables the startup auto-update; TRADECAT_FORCE_UPDATE=1 makes it blocking; TRADECAT_UPDATE_INTERVAL_SECONDS controls throttling (default 3600s).
    zh: TRADECAT_NO_AUTO_UPDATE=1 关掉启动时自动更新；TRADECAT_FORCE_UPDATE=1 改成阻塞 + 失败退出；TRADECAT_UPDATE_INTERVAL_SECONDS 控制节流（默认 3600 秒）。
  statement: |
    README 承诺：每次启动前节流检查（默认 1h），失败默认继续用本地版，
    TRADECAT_NO_AUTO_UPDATE=1 可关闭，TRADECAT_FORCE_UPDATE=1 可改为阻塞 +
    失败退出。launcher 必须有这三处行为分支。
  business_expectation: 用户能控制是否被自动拉取的新版「打断今天的工作」。
  evidence_needed: launcher（install.sh 中写到 ~/.local/bin/tradecat 的内容）+ 三个 env var 的真实分支。
  status: passed
  last_run: runs/2026-05-07/run-static-checks
  note: install.sh 里 TRADECAT_NO_AUTO_UPDATE / TRADECAT_FORCE_UPDATE / TRADECAT_UPDATE_INTERVAL_SECONDS 共 8 次引用；3 处分支（关闭 / 强制 / 节流）齐备。
- id: claim-007
  title: 端到端 happy path：sync 一次后能看到真实事件流
  source: README "常用命令"
  source_ref: tradecat init / sync / TUI
  priority: critical
  area: end-to-end
  user_icon: "🌐"
  user_title:
    en: A real install + sync + render flow shows real data
    zh: 真的装一次能看到真实数据
  user_description:
    en: After install, `tradecat init && tradecat sync && tradecat` should fetch from Google Sheets and render real rows; offline path degrades to "cache state shown but no data" without traceback.
    zh: 装好后 `tradecat init && tradecat sync && tradecat` 应该能从 Google Sheets 拉到真实数据并显示；离线时降级为「Cache 状态显示但无数据」而不是 traceback。
  statement: |
    装好后 `tradecat init && tradecat sync && tradecat`（或 `tradecat tui --plain`）
    能从 Google Sheets 拉到至少 1 个 dataset 的真实数据并显示，而不是空表。
    离线 / Sheets 无权限时降级为「Cache 状态显示但无数据」而不是 traceback。
  business_expectation: 新用户在现实网络下真的能看到行情数据。
  evidence_needed: molecule 级 — 需要真实安装 + 真实网络。建议 runs/<date>/run-live-sync/ 记录 exit code、cache 大小、数据集 row count。
  status: untested
  skip_reason: |
    repo-evals 框架禁止把未授信工具装到评测者本地系统。该 claim 需要 curl|sh 改 PATH +
    Google Sheets 真实拉取。建议项目方把这条 e2e 录到 CI 的 artifact 里（一次 sync run
    + 三段 exit code + cache 体积），让外部评测者不用上手安装也能验。
- id: claim-008
  title: Skill 外壳 + 项目源边界（root SKILL.md / AGENTS.md / scripts/project/）
  source: README "根目录应有文件"
  source_ref: SKILL.md + AGENTS.md + scripts/project/AGENTS.md
  priority: high
  area: skill-shell-boundary
  user_icon: "🏠"
  user_title:
    en: Clean Skill-shell + project-source layout
    zh: Skill 外壳和项目源界限清晰
  user_description:
    en: Root holds SKILL.md (197 lines) + AGENTS.md (98 lines) + references/ (8 long docs); the Python project is fully isolated under scripts/project/ with its own AGENTS.md (258 lines). The two boundaries don't leak.
    zh: 根目录是 SKILL.md（197 行）+ AGENTS.md（98 行）+ references/（8 篇长文档）；Python 项目完整隔离在 scripts/project/，有自己 258 行的 AGENTS.md。两层边界不互相污染。
  statement: |
    重构后仓库分为两层：根 = Skill 外壳（SKILL.md 入口 + AGENTS.md 治理 + references/ 长文档
    + scripts/ 治理薄脚本），scripts/project/ = 真实 Python 项目（pyproject.toml /
    src/ / tests/ / install.sh）。两层各有独立 AGENTS.md。这套结构让 Skill 用户和
    Python 开发者看到不同的入口。
  business_expectation: 想抄一份 Skill 外壳布局做自己 repo 的人有现成参考。
  evidence_needed: 根目录 ls + SKILL.md / AGENTS.md / scripts/project/AGENTS.md 行数 + 进入项目的薄封装脚本（run-tradecat.sh / verify.sh）真实存在。
  status: passed
  last_run: runs/2026-05-07/run-static-checks
  note: |
    根 SKILL.md 197 行 / AGENTS.md 98 行；scripts/project/AGENTS.md 258 行；
    references/ 8 篇文档（architecture / cache-contract / install-uninstall / linear-flows /
    quality-gate / release / tui-contract + index）；scripts/verify.sh 是 10 行薄封装，
    先跑 validate-skill.sh 再 cd 进项目跑项目级 verify。
- id: claim-009
  title: GitHub Actions CI 真实存在（含 skill strict + secret scan）
  source: .github/workflows/ci.yml
  source_ref: .github/workflows/ci.yml
  priority: high
  area: ci-pipeline
  user_icon: "🤖"
  user_title:
    en: Real CI runs strict skill validation + secret scan
    zh: 有真实 CI，跑 skill 严格校验 + 凭证扫描
  user_description:
    en: ci.yml triggers on push + pull_request, sets up Python 3.12, runs `bash scripts/validate-skill.sh --strict`, runs a secret scan on the diff (PR or push range), then audits package supply chain.
    zh: ci.yml 监听 push 和 pull_request，装 Python 3.12，跑 `bash scripts/validate-skill.sh --strict`，对 diff 跑 secret scan（PR / push 区间），再做包供应链审计。
  statement: |
    .github/workflows/ci.yml 真实存在，至少包含 3 个步骤：actions/checkout + setup-python 3.12 +
    bash scripts/validate-skill.sh --strict + 一段在 diff 上跑的 secret scan。这条让
    release_pipeline_score 从 1 提升到 2。
  business_expectation: PR 合并前会被自动校验 skill 结构和凭证泄漏，外部贡献者不会因为格式问题阻塞。
  evidence_needed: ci.yml 的真实 step 列表 + 关键 run 命令。
  status: passed
  last_run: runs/2026-05-07/run-static-checks
  note: ci.yml 包含 19 个 run 步骤；触发条件 push + pull_request；含 validate-skill.sh --strict + secret scan + supply-chain audit。
