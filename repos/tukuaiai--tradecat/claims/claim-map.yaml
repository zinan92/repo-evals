- id: claim-011
  title: 测试覆盖薄但密度合理（单文件 1622 行 / 81 个测试函数）
  source: scripts/project/tests/
  source_ref: scripts/project/tests/test_cache_tui.py
  priority: medium
  area: test-coverage
  user_icon: "🧪"
  user_title:
    en: Tests exist, but concentrated in one file
    zh: 有测试，但集中在一个文件
  user_description:
    en: tests/ has only one file (test_cache_tui.py, 1622 lines, 81 test functions). Coverage is real but the lack of decomposition is a refactor risk — moving any module touching cache or TUI requires touching this single file.
    zh: tests/ 只有一个文件（test_cache_tui.py，1622 行，81 个测试函数）。覆盖是真的，但没有拆分是重构风险 —— 改动任何 cache 或 TUI 相关模块都得碰这一个文件。
  statement: |
    项目有测试套件且测试函数数量充足（>50），但全部集中在单一 test_cache_tui.py。
    这是一个值得 surface 的 quality signal：能 PASS 但应该拆。
  business_expectation: 想 fork 这个项目做改动的人，需要预期所有相关测试改动都集中在一个文件里。
  evidence_needed: tests/ ls + 单文件 wc -l + grep -c "def test_"。
  status: passed
  last_run: runs/2026-05-07/run-static-checks
  note: 单文件 1622 行 / 81 个 test_ 函数；可通过但 brittle to refactor。
- id: claim-012
  title: 仓库依然没有 LICENSE 文件（README MIT 徽章不真）
  source: gh api repos/tukuaiai/tradecat + README badges
  source_ref: GitHub API + repo tree
  priority: critical
  area: legal
  user_icon: "⚖️"
  user_title:
    en: No LICENSE file — fork at your own legal risk
    zh: 没有 LICENSE 文件 —— fork 有法律风险
  user_description:
    en: README shows an MIT badge, but `gh api repos/tukuaiai/tradecat` returns license=null and there is no LICENSE file in the tree. With 935 stars, this is a meaningful liability — fork or commercial use is not legally clean despite the badge.
    zh: README 标了 MIT 徽章，但 `gh api repos/tukuaiai/tradecat` 返回 license=null，仓库根也没 LICENSE 文件。935 star 还无授权，fork 或商业用法律上不干净，徽章不代表授权。
  statement: |
    GitHub API 报 license=null；GET /contents/LICENSE 返回 404。README MIT 徽章
    在没有 LICENSE 文件的情况下不构成实际授权。这是上次评测（2026-05-04）的发现，
    本次重测仍未修复。
  business_expectation: 用户应当被警告：徽章 ≠ 授权，二次分发或商业使用前需要联系作者补 LICENSE。
  evidence_needed: gh api 输出 + GET contents/LICENSE 状态码。
  status: failed
  last_run: runs/2026-05-07/run-static-checks
  note: |
    gh api repos/tukuaiai/tradecat → license: null；
    gh api repos/tukuaiai/tradecat/contents/LICENSE → 404 Not Found。
    距上次发现已 3 天未修，star 从 928 涨到 935。
