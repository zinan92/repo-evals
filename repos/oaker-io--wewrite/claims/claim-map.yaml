    business_expectation: "Generated articles have distinct voice styles."
    evidence_needed: "File count + YAML structure check."
    status: passed
    evidence: |
      5 personas found with detailed parameters: voice_density, uncertainty_rate,
      data_reaction_style, paragraph_max_length, emotional_arc, opening_style,
      closing_tendency. midnight-friend includes calibrated humanness scores.

  - id: claim-008
    title: "SEO keyword scoring works with live data"
    source: SKILL.md
