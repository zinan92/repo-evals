# Curated claim map for oaker-io/wewrite
# Evaluated: 2026-04-13
# Archetype: hybrid-skill (Python skill for WeChat article generation)

claims:
  # === SUPPORT LAYER (deterministic code) ===

  - id: claim-001
    title: "pip install succeeds from requirements.txt"
    source: README
    source_ref: "Install section"
    priority: critical
    area: support-install
    statement: |
      requirements.txt lists 8 dependencies. pip install -r requirements.txt
      succeeds in a fresh Python 3.13 venv with no errors.
    business_expectation: "New users can install dependencies cleanly."
    evidence_needed: "pip install output + exit code 0"
    status: passed
    evidence: |
      pip install -r requirements.txt in fresh venv: exit 0. 8 deps installed.

  - id: claim-002
    title: "6 CLI commands all respond to --help"
    source: SKILL.md
    source_ref: "toolkit/cli.py"
    priority: critical
    area: support-cli
    statement: |
      The toolkit CLI provides 6 subcommands: preview, publish, themes,
      image-post, gallery, learn-theme. All respond to --help.
    business_expectation: "Users can discover and use all CLI tools."
    evidence_needed: "Each command's --help output + exit code."
    status: passed
    evidence: |
      All 6 commands return help text with exit 0:
      preview, publish, themes, image-post, gallery, learn-theme.

  - id: claim-003
    title: "Markdown→WeChat HTML conversion works"
    source: README
    source_ref: "Core capability"
    priority: critical
    area: support-converter
    statement: |
      toolkit/converter.py converts Markdown to WeChat-compatible HTML with:
      inline CSS only, link→footnote conversion, dark mode attributes, CJK formatting.
    business_expectation: "Output HTML can be pasted into WeChat editor."
    evidence_needed: "Convert a test .md file, verify output HTML features."
    status: passed
    evidence: |
      `python3 toolkit/cli.py preview test.md -t professional-clean -o output.html --no-open`
      produces HTML with: inline style= attributes, superscript footnotes for links,
      data-darkmode-bgcolor/color attributes, no <style> in article body.

  - id: claim-004
    title: "Hotspot fetching returns live data from 3 sources"
    source: SKILL.md
    source_ref: "scripts/fetch_hotspots.py"
    priority: critical
    area: support-hotspots
    statement: |
      fetch_hotspots.py aggregates real-time trends from Weibo, Toutiao, and Baidu.
    business_expectation: "Topic selection uses current trends, not stale data."
    evidence_needed: "Run with --limit 5, verify 3 sources return data."
    status: passed
    evidence: |
      `python3 scripts/fetch_hotspots.py --limit 5` returned structured JSON.
      sources_failed: []. All 3 sources (Weibo, Toutiao, Baidu) returned live data
      with title, source, hot_score, url, normalized_score.

  - id: claim-005
    title: "16 themes exist with full YAML config + dark mode"
    source: README
    source_ref: "themes section"
    priority: high
    area: support-themes
    statement: |
      16 themes in toolkit/themes/ with YAML config including colors,
      dark mode colors, and base_css.
    business_expectation: "Users have variety. Themes work in WeChat dark mode."
    evidence_needed: "Count themes, check YAML structure."
    status: passed
    evidence: |
      16 themes found: bauhaus, bold-green, bold-navy, bytedance, elegant-rose,
      focus-red, github, ink, midnight, minimal, minimal-gold, newspaper,
      professional-clean, sspai, tech-modern, warm-editorial.
      Each has name, description, colors, darkmode_colors, base_css.

  - id: claim-006
    title: "9 image generation providers implemented"
    source: SKILL.md
    source_ref: "toolkit/image_gen.py"
    priority: high
    area: support-image-gen
    statement: |
      9 providers with generate() methods and auto-fallback chain:
      Doubao, OpenAI, Gemini, DashScope, MiniMax, Replicate, Azure, OpenRouter, Jimeng.
    business_expectation: "Image generation works even if one provider is down."
    evidence_needed: "Code review of provider classes + fallback logic."
    status: passed
    evidence: |
      All 9 provider classes exist with generate() methods in image_gen.py (754 lines).
      Provider chain with auto-fallback implemented. Size presets for WeChat.
      Cannot test actual generation without API keys (expected for this layer).

  - id: claim-007
    title: "5 writing personas with rich YAML config"
    source: SKILL.md
    source_ref: "personas/"
    priority: high
    area: support-personas
    statement: |
      5 persona files: cold-analyst, industry-observer, midnight-friend,
