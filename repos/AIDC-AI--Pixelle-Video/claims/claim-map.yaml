- id: claim-006
  title: Live e2e — generate one short video from idea to finished MP4
  source: README "AI Fully Automated Short Video Engine"
  source_ref: docker-compose.yml
  priority: critical
  area: end-to-end
  statement: |
    Run docker-compose up, drive a real script-to-video flow (idea →
    AI script → AI assets → assembled MP4), verify the output is a
    real watchable short video file.
  business_expectation: |
    The "fully automated" claim works end-to-end on real LLM + asset
    services, not just lab demos.
  evidence_needed: |
    Needs a real Docker host + LLM provider key + asset/video provider
    keys + a starting idea. One happy path + one error case.
  status: untested
