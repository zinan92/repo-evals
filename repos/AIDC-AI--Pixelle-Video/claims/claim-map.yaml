  source_ref: pixelle_video/ + api/
  priority: critical
  area: pipeline-implementation
  statement: |
    pixelle_video/ has pipelines/, models/, llm_presets.py, config/.
    api/ has app.py + routers/ + schemas/ + tasks/ — FastAPI service.
    Real Python pipeline + service.
  business_expectation: |
    "AI 全自动短视频引擎" claim corresponds to a real pipeline + API,
    not a demo notebook.
