workflow_diagram:
  layout: tree
  why_layer:
    en: |
      Compound — at multiple stages the LLM decides at runtime: which scene types to use for this idea, which voiceover style fits, which b-roll to pick, what music. The pipeline structure is fixed but the LLM-runtime choices make every run different. A molecule would be deterministic; this is a compound.
    zh: |
      复合物 —— 多个 stage 里 LLM 运行时决定: 这个想法用哪些场景类型 / 适合什么配音风格 / 挑哪些 b-roll / 用什么音乐。Pipeline 结构固定,但 LLM 运行时选择让每次跑都不同。分子会是确定性的;这个是复合物。
  nodes:
  - id: input
    type: start
    rank: 0
    lane: 1
    label:
      en: |-
        Idea (text prompt)
      zh: |-
        想法 (文字 prompt)
  - id: dec_script
    type: decision
    rank: 1
    lane: 1
    label:
      en: |-
        LLM decides:
        script structure
      zh: |-
        LLM 决定:
        脚本结构
  - id: script_short
    type: atom
    rank: 2
    lane: 0
    label:
      en: |-
        Short narrative
        (30-60s)
      zh: |-
        短叙事
        (30-60 秒)
  - id: script_long
    type: atom
    rank: 2
    lane: 2
    label:
      en: |-
        Long-form
        (60-90s)
      zh: |-
        长格式
        (60-90 秒)
  - id: dec_scene
    type: decision
    rank: 3
    lane: 1
    label:
      en: |-
        LLM decides:
        scene composition
      zh: |-
        LLM 决定:
        场景组成
  - id: voiceover
    type: atom
    rank: 4
    lane: 1
    label:
      en: |-
        Voiceover gen
        (TTS / cloned voice)
      zh: |-
        配音生成
        (TTS / 克隆音)
  - id: assembly
    type: atom
    rank: 5
    lane: 1
    label:
      en: |-
        Scene + audio
        + music assembly
      zh: |-
        场景 + 音频
        + 音乐组装
  - id: out
    type: end
    rank: 6
    lane: 1
    label:
      en: |-
        Finished MP4
      zh: |-
        成品 MP4
  edges:
  - {from: input, to: dec_script}
  - {from: dec_script, to: script_short, label: {en: short, zh: 短}}
  - {from: dec_script, to: script_long, label: {en: long, zh: 长}}
  - {from: script_short, to: dec_scene}
  - {from: script_long, to: dec_scene}
  - {from: dec_scene, to: voiceover}
  - {from: voiceover, to: assembly}
  - {from: assembly, to: out}
