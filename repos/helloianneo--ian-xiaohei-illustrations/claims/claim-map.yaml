    evidence_needed: |
      多篇生成后与旧案例做相似度对照（需图像模型）。
    status: untested
    evidence: |
      未测。反复刻规则文档完整（列了 9 个禁止复用构图 + 换隐喻示例），但是否真的不复刻要看
      模型生成结果，无凭证无法验证。

  - id: claim-012
    user_icon: "🔤"
    user_title:
      en: "The Chinese labels render legibly (no garbled text)"
      zh: "图里中文标注清晰可读（不出乱码错字）"
    user_description:
      en: "Chinese text baked into AI images is a known failure mode (typos / hallucinated tags). The skill itself warns about this and asks for review — so 'labels are legible' is a real, unverified risk."
      zh: "AI 图里烧录中文是已知坑（错字 / 幻觉标签）。skill 自己也警告并要求检查——所以「标注清晰」是一个真实、未验证的风险点。"
    title: 中文标注可读性
    source: README + qa-checklist.md
    source_ref: "注意事项 / 失败信号"
    priority: medium
    area: core
    statement: |
      生成图中的中文手写标注拼写正确、可读，无明显乱码 / 幻觉标签。
    evidence_needed: |
      对生成产物人工核字（需图像模型）。
    status: untested
    evidence: |
      未测。skill 明确承认「AI 图像模型可能出现错字 / 幻觉标签 / 风格漂移」并给了「减少标注词并
      重生成」的对策——即作者自己也把它当已知风险。无凭证无法验证实际错字率。
