  # --- CORE layer (the IMAGE output — image-model-dependent, UNTESTED) ---

  - id: claim-009
    user_icon: "🎨"
    user_title:
      en: "The generated image is actually on-brand and usable"
      zh: "生成的图真的 on-brand、能用"
    user_description:
      en: "The core promise: a rendered image is 16:9, pure-white, hand-drawn, ~40-60% subject, with 小黑 truly carrying the core action and legible sparse Chinese labels. UNVERIFIED — the render needs an external image model this eval could not run."
      zh: "核心承诺：出来的图是 16:9、纯白、手绘、主体约 40-60%、小黑真承担核心动作、中文标注少而可读。未验证——出图要一个本次评估无法运行的外部图像模型。"
    title: 核心承诺：图 on-brand 且可用
    source: README + SKILL.md
    source_ref: "视觉风格 / 输出口径"
    priority: critical
    area: core
    statement: |
      按 skill 生成的实际图像满足风格契约（16:9 / 纯白 / 手绘 / 小黑主体 / 少字可读 /
      非 PPT），且可直接用作正文配图。
    evidence_needed: |
      在真实图像模型上生成 4-8 张并逐项对照 qa-checklist 打分（需图像模型凭证）。
    status: untested
    evidence: |
      未测。产物是外部图像模型（默认 Codex 内置 image_gen）渲染，本次评估无凭证、无法运行。
      作者示例图仅证明「这套 prompt 出过图」，不证明「你这篇每张都 on-brand / 可用」。
      image-model-dependent，isolation 下不可静态验证 → 核心层全黑。

  - id: claim-010
    user_icon: "🚫"
    user_title:
      en: "The banned looks (PPT / cute / top-left title) really stay out"
      zh: "禁忌样式（PPT / 可爱 / 左上角标题）真的没出现"
    user_description:
      en: "SKILL.md and qa-checklist explicitly ban PPT-infographic feel, cute mascots, and top-left type titles. Whether real output respects that anti-slop contract is unverified without generating images."
      zh: "SKILL.md 与 qa-checklist 明确禁 PPT 信息图感、可爱吉祥物、左上角类型标题。真实产出是否遵守这套 anti-slop 契约，不生图就无法验证。"
    title: anti-slop 规则在产出中被遵守
    source: SKILL.md
    source_ref: "绝对不要 / 失败信号"
    priority: high
    area: core
    statement: |
      真实生成图中不出现被禁模式（PPT / 课件 / 可爱卡通 / 左上角类型标题 / 复杂架构 / 纸纹阴影）。
    evidence_needed: |
      对生成产物逐条对照 anti-slop 列表 pass/fail（需图像模型）。
    status: untested
    evidence: |
      未测。anti-slop 契约在提示词侧写得很硬，但图像模型是否遵守取决于模型与那次发挥，
      无凭证无法验证。作者示例图看似合规，但不能代表任意文章的产出。

  - id: claim-011
    user_icon: "🌀"
    user_title:
      en: "It invents a fresh metaphor instead of cloning old cases"
      zh: "每篇重新发明隐喻，而非复刻旧案例"
    user_description:
      en: "The skill's anti-cloning rule tells the agent to reinvent a metaphor per article rather than reuse the gallery compositions. Whether the image model actually avoids clones is unverified statically."
      zh: "skill 的反复刻规则要求每篇重新发明隐喻、不复用图库构图。图像模型实际是否避免复刻，静态无法验证。"
    title: 原创隐喻 / 非复刻
    source: references/composition-patterns.md
    source_ref: "反复刻规则"
    priority: medium
    area: core
    statement: |
