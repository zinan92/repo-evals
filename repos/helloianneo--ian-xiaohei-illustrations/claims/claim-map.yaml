# Claim map for ian-xiaohei-illustrations (prompt-skill).
# SUPPORT layer = static prompt scaffolding (fully testable statically): frontmatter,
#   reference resolution, README↔SKILL coverage, style/QA coherence, license, triggers.
# CORE layer = the actual IMAGE output (molecule; image-model-dependent). The real
#   renderer is an EXTERNAL image model we have no credentials for → core claims are
#   UNTESTED. The author's example gallery proves "it renders something", not quality.
# Statuses reflect the 2026-07-09 static eval (no live image-model run performed).

claims:
  # --- SUPPORT layer (static prompt scaffolding) -------------------------

  - id: claim-001
    user_icon: "📑"
    user_title:
      en: "Skill loads without parse errors and declares its triggers"
      zh: "Skill 能正常加载，且声明了触发词"
    user_description:
      en: "SKILL.md has valid YAML frontmatter (name + a rich description). The agent host accepts it and knows when to fire it, instead of falling back to generic chat."
      zh: "SKILL.md 的 YAML frontmatter 合法（name + 丰富的 description）。Agent 能加载并知道何时触发，而不是退化成普通对话。"
    title: SKILL.md frontmatter 合法且含触发规格
    source: SKILL.md
    source_ref: "frontmatter (name / description)"
    priority: critical
    area: skill-structure
    statement: |
      SKILL.md 有合法 YAML frontmatter，name 与 description 均非空，
      description 内含中文触发词（怪诞 / 小黑 / 手绘 / 正文配图 / shot list / 去标题）。
    evidence_needed: |
      解析 frontmatter，确认必填字段非空且 description 列出触发场景。
    status: passed
    evidence: |
      frontmatter: name=ian-xiaohei-illustrations，description 明列「中文文章 / 帖子 /
      博客 / Notion / 方法论 / 流程 / 隐喻」+「怪诞 / 小黑 / 手绘 / 正文配图 / 文章插图 /
      shot list / 去标题/改图」等触发词。合法、可加载。

  - id: claim-002
    user_icon: "🔗"
    user_title:
      en: "Every referenced file actually exists"
      zh: "引用的每个文件都真实存在"
    user_description:
      en: "SKILL.md points the agent at 5 reference files + an examples dir. All resolve, so the agent won't hallucinate a missing style rule mid-generation."
      zh: "SKILL.md 让 agent 去读 5 份参考文件 + 示例目录。全部解析得到，agent 不会因为某条风格规则文件缺失而在生成中途瞎编。"
    title: SKILL.md 引用完整性
    source: SKILL.md
    source_ref: "references/*.md + assets/examples/"
    priority: critical
    area: skill-integrity
    statement: |
      SKILL.md「先读这些参考」列出的 references/style-dna.md、xiaohei-ip.md、
      composition-patterns.md、prompt-template.md、qa-checklist.md 与 assets/examples/
      均存在于仓库。
    evidence_needed: |
      比对 SKILL.md 引用路径与实际文件树。
    status: passed
    evidence: |
      文件树核对：5 份 references/*.md 全部存在；ian-xiaohei-illustrations/assets/examples/
      下 14 张 PNG 存在。零悬挂引用。

  - id: claim-003
    user_icon: "🎯"
    user_title:
      en: "Every capability the README sells has a real workflow"
      zh: "README 卖的每个能力在 SKILL 里都有路径"
    user_description:
      en: "README advertises shot-list planning, generating body illustrations, single-concept images, and title-removal edits. All four map to a real step in SKILL.md or prompt-template.md — no 'advertised but not built'."
      zh: "README 承诺 shot list 规划、生成正文配图、单概念一张图、去标题改图。四项都能在 SKILL.md 工作流或 prompt-template.md 找到对应步骤——没有「宣传了但没实现」。"
    title: README 能力↔SKILL 覆盖
    source: README + SKILL.md
    source_ref: "怎么用 / 工作流"
    priority: high
    area: coverage
    statement: |
      README 的 4 类能力（shot list 规划 / 生成配图 / 单概念一张图 / 去标题改图）
      在 SKILL.md 工作流或 prompt-template.md 中均有对应执行路径。
    evidence_needed: |
      一一对应表 + 证据引用。
    status: passed
    evidence: |
      shot list→SKILL 步骤2；生成配图→步骤3（单张 image_gen）；单概念→prompt-template 主模板；
      去标题/改图→prompt-template.md「图像编辑提示」段（Remove-title + 增强怪诞感两条）。4/4 覆盖。

  - id: claim-004
    user_icon: "🧬"
    user_title:
      en: "A complete, coherent style-DNA + QA system (not a vibe)"
      zh: "有完整自洽的风格 DNA + QA 体系（不是一句口号）"
    user_description:
      en: "style-dna, xiaohei-ip, composition-patterns and qa-checklist form one consistent contract (pure white bg, 40-60% subject, sparse red/orange/blue labels, 小黑 as actor, anti-PPT). The rules don't contradict each other."
      zh: "style-dna、xiaohei-ip、composition-patterns、qa-checklist 构成一套自洽契约（纯白底、主体 40-60%、少量红橙蓝标注、小黑当动作主体、反 PPT）。规则之间不打架。"
    title: 风格 DNA / 构图 / QA 三件套自洽完整
    source: references/
    source_ref: "style-dna.md / xiaohei-ip.md / composition-patterns.md / qa-checklist.md"
    priority: high
    area: skill-content
    statement: |
      风格 DNA（颜色语义 + 禁忌）、小黑 IP（形象 + 动作库 + 禁止）、构图（8 结构类型 +
      原创隐喻三步法 + 反复刻规则）、QA（必过项 + 失败信号 + 迭代）互相一致、可执行。
    evidence_needed: |
      逐份读并核对规则一致性（颜色 / 留白 / 小黑参与 / 反 PPT 在四份里是否统一）。
    status: passed
    evidence: |
      四份规则一致：白底 + 35-60% 主体 + 红=重点/橙=主路径/蓝=补充 + 小黑承担核心动作 +
      禁 PPT/可爱/左上角标题，在 style-dna、qa-checklist、prompt-template 中口径一致。QA 有
      可执行的失败信号→迭代映射。

  - id: claim-005
    user_icon: "🧩"
    user_title:
      en: "The per-image prompt template is parameterized and self-contained"
      zh: "单张生图模板是参数化、自足的"
    user_description:
      en: "prompt-template.md is a fill-in-the-blanks English prompt with slots (theme / structure / composition / labels / color) plus baked-in constraints — you can drop it into any image model, not just Codex."
      zh: "prompt-template.md 是一段可填空的英文提示词，带槽位（主题 / 结构 / 构图 / 标注 / 颜色）+ 内置约束——可直接投给任意图像模型，不限 Codex。"
    title: prompt-template 参数化且模型无关
    source: references/prompt-template.md
    source_ref: "生图提示词模板"
    priority: high
    area: skill-content
    statement: |
      prompt-template.md 含明确变量槽位与硬约束（16:9 / 纯白底 / 小黑主体 / ≤5-8 中文标注 /
      禁标题），可移植到任意外部图像模型。
    evidence_needed: |
      读模板确认槽位 + 约束齐备且不依赖特定模型 API。
    status: passed
    evidence: |
      模板有 {正文配图主题}/{结构类型}/{核心意思}/{Composition}/{Suggested elements}/
      {Chinese labels}/Color use/Constraints 槽位，英文 prompt，模型无关。附两段改图提示。

  - id: claim-006
    user_icon: "🎣"
    user_title:
      en: "Trigger spec is specific enough to fire on the right asks"
      zh: "触发规格够具体，能在正确的请求上触发"
    user_description:
      en: "The description enumerates concrete trigger scenarios and keywords (怪诞 / 小黑 / 手绘 / 正文配图 / shot list / 去标题) so the host fires it on body-illustration intent rather than generic image asks."
      zh: "description 列了具体触发场景与关键词（怪诞 / 小黑 / 手绘 / 正文配图 / shot list / 去标题），让 host 在「正文配图」意图上触发，而非任意画图请求。"
    title: 触发词规格具体
    source: SKILL.md
    source_ref: "description"
    priority: high
    area: triggering
    statement: |
      description 枚举触发场景 + 关键词，覆盖规划 / 生成 / 单概念 / 改图四类意图。
    evidence_needed: |
      静态核对 description 触发词覆盖 README 用例；未做在线 trigger_test。
    status: passed_with_concerns
    evidence: |
      静态强：description 明列文章/帖子/Notion/方法论/流程/隐喻 + 怪诞/小黑/手绘/正文配图/
      shot list/去标题。但未运行在线 trigger_test.py 测 precision/recall（需 API harness），
      故记 passed_with_concerns：规格到位、未做在线触发精度测量。

