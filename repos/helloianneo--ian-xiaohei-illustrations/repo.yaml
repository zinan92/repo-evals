    this_better_at:
      en: "Produces the body ILLUSTRATIONS (an upstream visual asset) with a signature IP — the creative-content half gzh-design does not do."
      zh: "产出正文配图（上游视觉资产）+ 有识别度的 IP —— gzh-design 不做的创意内容那半。"
