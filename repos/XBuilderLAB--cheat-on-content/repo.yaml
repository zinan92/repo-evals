# === Maintainer / ecosystem signals (all API-verified, not eyeballed) ========
stars: 5287
archived: false
has_license: true          # gh api: MIT (spdx MIT) + LICENSE file 1086 bytes — verified
multilingual_readme: true  # README.md (EN) + docs/README_CN.md (简体中文)
release_pipeline_score: 3  # tag v0.1.0 + detailed CHANGELOG.md + migrations/registry.md (1.0→1.4). No CI.
