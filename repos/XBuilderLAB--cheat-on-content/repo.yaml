# repo.yaml — cheat-on-content dossier
# Evaluated 2026-07-05 by Mark (repo-evals), static + source-inspection only.
# No live end-to-end run (compound skill; needs a real content channel +
# platform credentials + a multi-day retro window). Score is ceiling-capped.

# === Identity ================================================================
