# === Internal architecture ===================================================
workflow_diagram:
  layout: linear
  why_layer:
    en: "Compound: a router SKILL.md dispatches natural-language triggers to 15 sub-skills at LLM runtime, with mode detection (cold-start vs calibration), hook-enforced state, and a spawned blind sub-agent. Static inspection validates the wiring and the enforcement code, but the user-facing value (do predictions actually calibrate over time?) needs a logged live run."
    zh: "Compound：总路由 SKILL.md 在 LLM 运行时把自然语言触发词派给 15 个子 skill，带模式检测（cold-start / calibration）、hook 强制的状态、以及 spawn 出来的盲打分子 agent。静态检查能验证接线和强制代码，但用户真正在意的价值（预测是否会随时间校准）需要一次 live run 才能证实。"
  nodes:
    - {id: input, type: start, rank: 0, lane: 0, label: {en: "draft / trigger word", zh: "草稿 / 触发词"}}
    - {id: router, type: process, rank: 1, lane: 0, label: {en: "SKILL.md router + mode detect", zh: "SKILL.md 路由 + 模式检测"}}
    - {id: blind, type: process, rank: 2, lane: 0, label: {en: "blind score (channel B, isolated)", zh: "盲打分（channel B 隔离）"}}
    - {id: predict, type: process, rank: 3, lane: 0, label: {en: "immutable prediction (hook-locked)", zh: "不可改预测（hook 锁定）"}}
    - {id: retro, type: process, rank: 4, lane: 0, label: {en: "T+3d retro (adapter data)", zh: "T+3d 复盘（adapter 抓数）"}}
    - {id: bump, type: process, rank: 5, lane: 0, label: {en: "rubric bump (re-score + cross-model audit)", zh: "rubric 升级（全量重打 + 跨模型审）"}}
    - {id: output, type: end, rank: 6, lane: 0, label: {en: "sharper personal rubric", zh: "更准的个人 rubric"}}
  edges:
    - {from: input, to: router}
    - {from: router, to: blind}
    - {from: blind, to: predict}
    - {from: predict, to: retro}
    - {from: retro, to: bump}
    - {from: bump, to: output}

