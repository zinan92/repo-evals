# === Workflow placement =====================================================
workflow_placements:
  - workflow_id: "park-content-v1"
    stage_id: "06_assembly"
    role: primary
    reason:
      en: "HyperFrames *is* creative assembly. Once the agent has a script/storyboard, HyperFrames is the tool that wraps it into the platform-ready creative artifact — vertical video for douyin/xhs/TikTok, intro/outro stings, animated explainers. HTML in, MP4 out."
      zh: "HyperFrames 就是「创意组装」这一步。Agent 有了脚本/分镜之后，HyperFrames 把它包成平台可用的创意产物 — 抖音/小红书/TikTok 竖版视频、片头片尾、动画讲解。HTML 进，MP4 出。"
  - workflow_id: "park-content-v1"
    stage_id: "05_production"
    role: supporting
    reason:
      en: "Also reaches up into production: the agent uses /hyperframes to author the HTML composition itself (the 'human-voiced draft in publishable form') — it's not just a renderer."
      zh: "也涉及「内容生产」：agent 用 /hyperframes 写 HTML 组合本身（「像人写的草稿，已是可发布形态」）— 不只是渲染器。"

# === Workflow diagram (compound — see why_layer) ============================
workflow_diagram:
  layout: linear
  why_layer:
    en: "Compound: at runtime an LLM picks which skill to invoke (/hyperframes vs /gsap vs /lottie vs /three vs /tailwind), and the framework dispatches to the right Frame Adapter (GSAP / Anime.js / Lottie / Three.js / CSS / WAAPI). Routing is dynamic, not a fixed pipeline."
    zh: "Compound 层：运行时 LLM 决定调哪个 skill（/hyperframes / /gsap / /lottie / /three / /tailwind），框架再 dispatch 到对应 Frame Adapter（GSAP / Anime.js / Lottie / Three.js / CSS / WAAPI）。路由是动态的，不是固定流水线。"
  nodes:
    - id: prompt
      type: start
      rank: 0
      lane: 0
      label:
        en: "User prompt"
        zh: "用户描述"
    - id: skill-router
      type: process
      rank: 1
      lane: 0
      label:
        en: "Agent picks skill"
        zh: "Agent 选 skill"
    - id: composition
      type: process
      rank: 2
      lane: 0
      label:
        en: "HTML composition"
        zh: "HTML 组合"
    - id: adapter
      type: process
      rank: 3
      lane: 0
      label:
        en: "Frame Adapter"
        zh: "Frame Adapter"
    - id: engine
      type: process
      rank: 4
      lane: 0
      label:
        en: "@hyperframes/engine (Puppeteer)"
        zh: "@hyperframes/engine（Puppeteer）"
    - id: producer
      type: process
      rank: 5
      lane: 0
      label:
        en: "@hyperframes/producer (FFmpeg)"
        zh: "@hyperframes/producer（FFmpeg）"
    - id: mp4
      type: end
      rank: 6
      lane: 0
      label:
        en: "MP4"
        zh: "MP4 视频"
  edges:
    - {from: prompt, to: skill-router}
    - {from: skill-router, to: composition}
    - {from: composition, to: adapter}
    - {from: adapter, to: engine}
    - {from: engine, to: producer}
    - {from: producer, to: mp4}

# === Comparison =============================================================
similar_repos:
  - slug: "remotion-dev--skills"
    shared_purpose:
      en: "AI-agent skill bundle that teaches an LLM how to author video compositions."
      zh: "教 LLM 如何写视频组合的 skill 包。"
    this_better_at:
      en: "Apache-2.0 (truly open source); HTML authoring (no JSX rewrite); first-class non-interactive CLI built for agents; bundles 13 skills covering 6 animation runtimes and 52 catalog blocks."
      zh: "Apache-2.0（真正开源）；HTML 创作（不用改写 JSX）；CLI 默认非交互、为 agent 而生；随包 13 skill 覆盖 6 个动画运行时 + 52 个 catalog block。"
    other_better_at:
      en: "Battle-tested Lambda distributed rendering, larger React-component ecosystem, longer history (Hyperframes is < 2 months old; Remotion has years of production scars healed)."
      zh: "成熟的 Lambda 分布式渲染、更大的 React 组件生态、更长的历史（Hyperframes 才不到 2 个月；Remotion 多年生产环境跑出来的）。"
