# Compound: ships skills (LLM-runtime routing across /hyperframes,
# /hyperframes-cli, /gsap, /tailwind, /lottie, /three, /animejs, …),
# and a multi-package framework (cli + core + engine + producer + studio +
# player + shader-transitions). Live agent-driven render run was not
# executed in this static eval, so core_layer_tested is intentionally false.
