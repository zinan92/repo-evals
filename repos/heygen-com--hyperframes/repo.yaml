# === Maintainer / ecosystem signals (verified via gh api) ====================
stars: 15863
archived: false
has_license: true                # Apache-2.0 — verified via repos API + LICENSE file
multilingual_readme: false
release_pipeline_score: 3        # 30 tags incl. v0.5.3, dedicated "Publish to npm" workflow,
                                 # CHANGELOG present, semver discipline (alpha/beta/RC tags)
eval_discipline_score: 3         # 11 active CI workflows: CI, regression, preview-regression,
                                 # Windows render verification, Player perf, CodeQL,
                                 # Catalog Previews, Docs, Copilot code review, Dependabot,
                                 # Publish to npm. Dockerfile.test for reproducible runs.
