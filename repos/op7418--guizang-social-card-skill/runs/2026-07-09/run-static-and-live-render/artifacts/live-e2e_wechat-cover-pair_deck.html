<!doctype html>
<html lang="zh-CN" data-accent="ikb">
<head>
  <meta charset="utf-8">
  <title>Skill 是能力商品 · 公众号封面对 Sample</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&family=Noto+Sans+SC:wght@200;300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <style>
    /* =========================================================
       SAMPLE — built from op7418/guizang-social-card-skill
       assets/template-swiss-card.html (Swiss International seed)
       + references/layout-recipes.md S01 Accent Cover
       + references/platform-specs.md WeChat Official Account Cover Pair
       + references/title-shortener.md (1:1 short title derivation)
       Produced by Mark (repo-evals) for Vera, 2026-07-09.
       ========================================================= */
    :root, [data-accent="ikb"] {
      --paper: #fafaf8; --ink: #0a0a0a;
      --grey-1: #f0f0ee; --grey-2: #d4d4d2; --grey-3: #737373;
      --accent: #002FA7; --accent-on: #ffffff;
    }
    :root {
      --sans: "Inter","Helvetica Neue",Helvetica,"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei UI",sans-serif;
      --sans-zh: "Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei UI","Inter",sans-serif;
      --mono: "IBM Plex Mono",ui-monospace,"SF Mono",Consolas,monospace;
      --sp-3:8px; --sp-4:12px; --sp-5:16px; --sp-6:24px; --sp-7:32px; --sp-8:40px; --sp-9:48px; --sp-11:80px; --sp-13:160px;
    }
    *,*::before,*::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: #1a1a1a; font-family: var(--sans); color: var(--ink);
      -webkit-font-smoothing: antialiased; padding: 64px 32px;
    }
    .sheet { display: flex; flex-direction: column; align-items: center; gap: 48px; }
    .poster { position: relative; background: var(--paper); color: var(--ink); overflow: hidden; isolation: isolate; }
    .poster.square { width: 1080px; height: 1080px; }
    .poster.wide   { width: 2100px; height: 900px; }
    .poster.square .content { padding: var(--sp-11) var(--sp-11); }
    .poster.wide   .content { padding: var(--sp-11) var(--sp-13); }
    .content { position: relative; width: 100%; height: 100%; z-index: 2; }
    .stack { display: flex; flex-direction: column; }
    .row   { display: flex; flex-direction: row; }
    .gap-6 { gap: var(--sp-6); } .gap-7 { gap: var(--sp-7); } .gap-9 { gap: var(--sp-9); }
    .grow  { flex: 1; }
    .h-statement { font-family: var(--sans); font-weight: 200; line-height: 1.05; letter-spacing: -.015em; margin: 0; color: var(--ink); }
    .poster.wide   .h-statement { font-size: 156px; }
    .poster.square .h-statement { font-size: 140px; }
    .lead { font-family: var(--sans-zh); font-weight: 400; font-size: 30px; line-height: 1.55; color: var(--ink); margin: 0; }
    .t-cat  { font-family: var(--sans); font-weight: 600; font-size: 22px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0; }
    .t-meta { font-family: var(--mono); font-weight: 500; font-size: 20px; letter-spacing: .14em; text-transform: uppercase; color: var(--grey-3); margin: 0; }
    .hr-accent { height: 3px; background: var(--accent); border: 0; width: 96px; margin: 0; }
    .chrome-min {
      display: flex; justify-content: space-between; align-items: center;
      font-family: var(--mono); font-size: 18px; letter-spacing: .14em; text-transform: uppercase; color: var(--grey-3);
      padding-bottom: var(--sp-6); border-bottom: 1px solid var(--grey-2); margin-bottom: var(--sp-9);
    }
    .pair-preview {
      width: 2400px; min-height: 1180px; background: var(--grey-1); padding: var(--sp-9);
      display: grid; grid-template-columns: 2100px 1080px; grid-template-rows: 900px 1080px;
      gap: var(--sp-9); align-content: center; justify-content: center;
    }
    .pair-preview .preview-wide   { grid-column: 1; grid-row: 1 / span 2; align-self: center; }
    .pair-preview .preview-square { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
    .pair-preview .preview-label {
      font-family: var(--mono); font-weight: 500; font-size: 18px; letter-spacing: .14em;
      text-transform: uppercase; color: var(--grey-3); margin-bottom: var(--sp-5);
    }
  </style>
</head>
<body>
  <main class="sheet">

    <!-- ============================================================
         公众号封面对 · S01 Accent Cover recipe (layout-recipes.md)
         Long title (21:9) : full statement
         Short title (1:1) : derived via title-shortener.md 5-step
         ============================================================ -->
    <section class="pair-preview">

      <div class="preview-wide">
        <p class="preview-label">21:9 · wechat-21x9-cover · 2100×900</p>
        <section class="poster wide" id="wechat-21x9">
          <div class="content stack gap-9">
            <div class="chrome-min">
              <span>AI 观察 · Skills</span>
              <span>2026.07</span>
            </div>
            <div class="stack gap-7">
              <p class="t-cat">观点 · Perspective</p>
              <h1 class="h-statement">Skill 是能力商品</h1>
            </div>
            <div class="grow"></div>
            <hr class="hr-accent">
            <p class="lead">不是提示词——是把经验、工作流、品味封装成可分发、可复用、可迭代的能力单元。</p>
            <div class="row gap-6">
              <p class="t-meta">Perspective 01</p>
              <p class="t-meta">/ Park</p>
            </div>
          </div>
        </section>
      </div>

      <div class="preview-square">
        <p class="preview-label">1:1 · wechat-1x1-cover · 1080×1080</p>
        <section class="poster square" id="wechat-1x1">
          <div class="content stack gap-9">
            <div class="chrome-min">
              <span>AI 观察</span>
              <span>2026.07</span>
            </div>
            <div class="stack gap-7">
              <p class="t-cat">观点 · Perspective</p>
              <h1 class="h-statement">经验封装<br>成商品</h1>
            </div>
            <div class="grow"></div>
            <hr class="hr-accent">
            <p class="lead">Skill 时代的能力资产。</p>
            <div class="row gap-6">
              <p class="t-meta">/ Park</p>
            </div>
          </div>
        </section>
      </div>

    </section>

  </main>
</body>
</html>
