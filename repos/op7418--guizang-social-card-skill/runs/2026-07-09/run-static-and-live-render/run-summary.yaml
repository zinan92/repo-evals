notes: |
  This run closes the two biggest gaps from run-static-and-render-attempt (2026-07-09, earlier
  same day): the deterministic layout gate (validate-social-deck.mjs) and the on-brand-render
  claim were both `untested` there because Playwright's exact pinned Chromium build
  (chromium_headless_shell-1223) wasn't available in the isolated environment's global cache
  (only 1208 and 1228 were present, and Playwright pins the exact build — no substitution).

  This run: `npx playwright install chromium` was re-attempted and succeeded this time
  (~260MB download, completed within the session). With chromium_headless_shell-1223 present,
  validate-social-deck.mjs actually ran against the same sample deck built earlier.

  First pass caught a REAL defect in the sample: the 21:9 title ("Skill 是能力商品，不是提示词",
  16 chars) wrapped to 2 lines, exceeding the S01 recipe's 1-line cap for wide boards (rule R6).
  This is meaningful evidence the validator is not a no-op — it found an actual problem in
  hand-assembled content. The title was shortened to "Skill 是能力商品" (8 chars), with the
  contrast clause moved into the lead/support line. Second pass: 2/2 sections clean, 0 fails,
  0 warns, exit 0.

  Both poster sections were then screenshotted to real PNG (isolated per-board viewport,
  avoiding a grid-layout screenshot artifact hit on the first screenshot attempt — documented
  and discarded, not included as evidence). Both PNGs were visually inspected: Swiss editorial
  layout is clean and correctly proportioned, the IKB blue accent (#002FA7) appears in exactly
  two places (category tag color + accent rule) with no bleed into other elements, Noto Sans SC
  renders all Chinese text legibly with no garbling, the "larger = lighter font-weight" rule is
  visually correct (h-statement at weight 200 reads as intended), whitespace/padding rhythm is
  comfortable, and the bottom metadata strip aligns precisely across both boards. No defects
  were found on inspection.

  Scope of what this DOES NOT cover: only one theme (IKB Blue) and one sample article were
  tested — no multi-theme or multi-article consistency check. The Live Photo (.pvt) pipeline
  was not exercised. Actual publishing to the WeChat Official Account editor (paste/upload
  behavior on the real platform) was not tested — this run verifies "produces a correct static
  PNG," not "survives the WeChat publish path." These remain untested (claim-013, claim-014).

  Verdict impact: core_layer_tested flipped false→true, evidence_completeness upgraded
  partial→portable, claim-009 and claim-010 flipped untested→passed. Recomputed score via
  verdict_calculator.py: 77 → 85 (🏭 production / team tier), still capped at legacy bucket
  `reusable` by evidence_completeness='portable' (see verdicts/2026-07-09-verdict-input.yaml
  ceiling_reasons) — full/recommendable would need multi-theme + multi-article coverage and a
  real WeChat-platform publish test.
