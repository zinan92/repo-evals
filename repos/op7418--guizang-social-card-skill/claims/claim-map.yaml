    source: README
    source_ref: "为什么是单文件 HTML 渲 PNG"
    priority: critical
    area: core-determinism
    statement: |
      版式由固定像素 CSS 画板 + 版式骨架决定，不含随机数或图像模型；同输入渲染像素一致。
    evidence_needed: |
      源码级确认画板尺寸固定、无随机 / 无图像模型；理想上双渲染像素比对。
    status: passed
    evidence: |
