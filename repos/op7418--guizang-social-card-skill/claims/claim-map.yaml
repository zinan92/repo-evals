# Claim map for guizang-social-card-skill (hybrid-skill).
# SUPPORT layer = deterministic code + static structure (fully testable statically /
#   with the zero-dep doc validator).
# CORE layer = LLM-driven page-planning + HTML→PNG render (molecule; needs a browser
#   for the deterministic layout gate and a human eye for aesthetics).
# Statuses reflect the 2026-07-09 eval — see runs/2026-07-09/ for evidence.

claims:
  # --- SUPPORT layer (deterministic / static) ----------------------------

  - id: claim-001
    user_icon: "🧾"
    user_title:
      en: "A zero-dep validator enforces the skill's own doc contract"
      zh: "一个零依赖校验器守住技能自己的文档契约"
    user_description:
      en: "check-skill-docs.mjs (node:fs only, no browser) asserts SKILL.md / references / PRODUCT.md / HANDOFF.md still contain every required guardrail + capability section and no root-output regression — a script, not the model's memory."
      zh: "check-skill-docs.mjs（仅用 node:fs、无浏览器）断言 SKILL.md / references / PRODUCT.md / HANDOFF.md 仍含每一条必需护栏 + 能力段落、且无 root-output 回归——靠脚本，不靠模型记性。"
    title: check-skill-docs.mjs 确定性 doc-integrity 校验
    source: package.json
    source_ref: "scripts.test:docs / scripts/check-skill-docs.mjs"
    priority: critical
    area: support-validation
    statement: |
      node scripts/check-skill-docs.mjs 运行通过，所有 doc-integrity 检查 PASS，退出码 0。
    evidence_needed: |
      在隔离 clone 里运行脚本，观察 PASS 计数与退出码。
    status: passed
    evidence: |
      实测：node scripts/check-skill-docs.mjs → 27/27 检查全 PASS，"27 skill doc checks passed."，EXIT_CODE=0。
      零依赖（仅 node:fs），无需 npm install / 浏览器即可运行。

