# === Internal architecture (Atom / Molecule / Compound) ======================
workflow_diagram:
  layout: linear
  why_layer:
    en: "Fixed sequential pipeline. The LLM fills copy and makes LOCAL design choices (Editorial vs Swiss, which of 28 recipes, which of 10 themes, crop / object-position) but performs NO runtime sub-agent routing or plan generation — that makes it a molecule, not a compound. The HTML→PNG render + the two validators are embedded deterministic atoms; the layout gate could not be executed in isolation (no browser)."
    zh: "固定顺序 pipeline。LLM 只填文案、做局部设计判断（选 Editorial 还是 Swiss、28 个骨架挑哪个、10 套主题选哪套、裁切 / object-position），运行时不做子 agent 路由或计划生成——所以是 molecule 而非 compound。HTML→PNG 渲染 + 两个校验器是嵌入的确定性 atom；版式关卡在隔离环境未能执行（无浏览器）。"
  nodes:
    - id: input
      type: start
      rank: 0
      lane: 0
      label:
        en: "Article / script / screenshots / subtitles / photo / video"
        zh: "文章 / 脚本 / 截图 / 字幕 / 照片 / 视频"
    - id: intake
      type: step
      rank: 1
      lane: 0
      label:
        en: "Intake: platform · ratio · style · images"
        zh: "Intake：平台 · 比例 · 风格 · 图源"
    - id: plan
      type: step
      rank: 2
      lane: 0
      label:
        en: "Extract story → page plan (hook + pages)"
        zh: "抽故事 → 拆页计划（钩子 + 分页）"
    - id: style
      type: step
      rank: 3
      lane: 0
      label:
        en: "Pick Editorial | Swiss + 1 of 10 themes"
        zh: "选 Editorial | Swiss + 10 主题选 1"
    - id: template
      type: step
      rank: 4
      lane: 0
      label:
        en: "Copy seed template + fill 28 layout recipes"
        zh: "拷种子模板 + 套 28 版式骨架"
    - id: render
      type: step
      rank: 5
      lane: 0
      label:
        en: "Playwright HTML → PNG (fixed-px boards)"
        zh: "Playwright HTML → PNG（固定像素画板）"
    - id: validate
      type: decision
      rank: 6
      lane: 0
      label:
        en: "validate-social-deck R1-R9 (0 FAIL?)"
        zh: "validate-social-deck R1-R9（0 FAIL？）"
    - id: output
      type: end
      rank: 7
      lane: 0
      label:
        en: "小红书 deck / 公众号 21:9+1:1 封面对 PNG"
        zh: "小红书组图 / 公众号 21:9+1:1 封面对 PNG"
  edges:
    - {from: input, to: intake}
    - {from: intake, to: plan}
    - {from: plan, to: style}
    - {from: style, to: template}
    - {from: template, to: render}
    - {from: render, to: validate}
    - {from: validate, to: output}

# === Comparison ==============================================================
similar_repos:
  - slug: "ponyodong2026--ponyo-cover-anchor-system"
    shared_purpose:
      en: "Generate scroll-stopping social covers / cards for Chinese content platforms."
      zh: "为中文内容平台产出能停住滑动的社交封面 / 卡片。"
    this_better_at:
      en: "The 公众号 21:9+1:1 cover PAIR as an exact-ratio system, and DETERMINISM: output is a fixed-px CSS render (HTML→PNG), not a prompt formula — same template + content → same pixels, no image-model / phrasing variance. Ships a real 9-rule DOM layout validator + a doc-integrity validator, a 28-recipe × 10-theme design system, and a Live Photo branch. It renders the whole card, not just the hook line."
      zh: "公众号 21:9+1:1 封面对作为精确比例系统，以及确定性：产物是固定像素的 CSS 渲染（HTML→PNG），不是 prompt 公式——同模板 + 同内容 → 同像素，无图像模型 / 措辞漂移。随包一个真实的 9 规则 DOM 版式校验器 + 文档完整性校验器、28 骨架 × 10 主题的设计系统、以及 Live Photo 分支。它渲整张卡，不只是钩子那行字。"
    other_better_at:
      en: "Ponyo's cover-anchor / hook-title formulas are a lighter, prompt-native 小红书 sub-lane — no Node / Playwright / Chromium dependency, instant on any chatbot, and focused on the title-hook 'anchor' psychology rather than full-card layout. Complementary, not competing: ponyo shapes the hook line, guizang renders the whole cover. (No repo-evals dossier exists for ponyo yet — head-to-head is directional.)"
      zh: "Ponyo 的封面锚点 / 钩子标题公式是更轻、prompt 原生的小红书子赛道——无 Node / Playwright / Chromium 依赖，任何 chatbot 即开即用，聚焦标题钩子的「锚点」心理而非整卡版式。互补而非竞争：ponyo 打磨钩子那行，guizang 渲整张封面。（ponyo 目前无 repo-evals dossier，头对头为方向性判断。）"
  - slug: "op7418--guizang-material-illustration"
    shared_purpose:
      en: "Both are op7418 Vera-lane image skills that produce a visual ASSET for a content piece and hand it to a layout skill."
      zh: "都是 op7418 的 Vera 系图像 skill：产出内容用的视觉 ASSET，再交给排版 skill。"
    this_better_at:
      en: "Renders DETERMINISTICALLY via HTML→PNG (a CSS layout it fully controls), so its core is testable by a shipped layout validator — whereas material-illustration's central image comes from an EXTERNAL image model it does not control (core_layer_tested=false, model-dependent). guizang-social-card also produces platform-ready FINISHED decks / cover pairs, not a loose middle image."
      zh: "通过 HTML→PNG 确定性渲染（它完全掌控的 CSS 版式），核心可被随包版式校验器测——而 material-illustration 的中心图由它并不掌控的外部图像模型渲染（core_layer_tested=false，依赖模型）。guizang-social-card 还直接产平台可用的成品组图 / 封面对，而非一张散图。"
    other_better_at:
      en: "material-illustration solves the 'middle explanatory picture' problem guizang-card does not touch — Chinese-labeled mechanism diagrams, value-faithful chart beautification, reference-informed illustration. It is lighter (no Playwright / Chromium) since it delegates rendering to the image model."
      zh: "material-illustration 解决 guizang-card 不碰的「中间那张解释图」——带中文标签的机制图、逐值保真的图表美化、参考辅助配图。它更轻（无 Playwright / Chromium），因为把渲染交给了图像模型。"
