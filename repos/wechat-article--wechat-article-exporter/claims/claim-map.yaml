  title: Nuxt + Vue web app for batch downloading WeChat 公众号 articles
  source: README "微信公众号文章批量下载"
  source_ref: nuxt.config.ts + components/ + apis/
  priority: critical
  area: web-app-implementation
  statement: |
    Nuxt + Vue 3 web app. Confirmed: nuxt.config.ts at root, components/
    has dashboard / api / base subdirs, apis/index.ts is the API layer,
    composables/, layouts/, etc. Real production-shape Nuxt project.
  business_expectation: |
    The "在线网站" claim is real Vue/Nuxt code that runs in browser.
  status: passed
  last_run: runs/2026-05-06/run-static-checks
  note: Nuxt 3 project with components/ + composables/ + config/ + apis/. Substantial code base.
- id: claim-002
