  source: README "支持下载各种文件格式，其中 HTML 格式可100%还原文章排版与样式"
  source_ref: components/ (export logic)
  priority: high
  area: format-fidelity
  statement: |
    Export-to-HTML produces a file that visually matches the original
    WeChat article (preserves images / styles / layout / inline css).
  business_expectation: |
