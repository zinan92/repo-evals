workflow_diagram:
  layout: linear
  why_layer:
    en: |
      Molecule — fixed Nuxt request pipeline (URL parse → WeChat API call → article-list fetch → per-article download → format conversion → bulk export). No LLM-runtime routing.
    zh: |
      分子 —— 固定的 Nuxt 请求流水线(URL 解析 → WeChat API 调用 → 文章列表抓取 → 逐篇下载 → 格式转换 → 批量导出)。运行时无 LLM 路由。
  nodes:
  - id: input
    type: start
    rank: 0
    lane: 0
    label:
      en: |-
        公众号 URL paste
      zh: |-
        贴公众号 URL
  - id: auth
    type: atom
    rank: 1
    lane: 0
    label:
      en: |-
        Auth flow
        (cookie / WeChat token)
      zh: |-
        鉴权
        (cookie / WeChat token)
  - id: list
    type: atom
    rank: 2
    lane: 0
    label:
      en: |-
        Article list fetch
      zh: |-
        文章列表抓取
  - id: fetch
    type: atom
    rank: 3
    lane: 0
    label:
      en: |-
        Per-article download
        (incl. images)
      zh: |-
        逐篇下载
        (含图片)
  - id: format
    type: atom
    rank: 4
    lane: 0
    label:
      en: |-
        Format convert
        (HTML / md / etc.)
      zh: |-
        格式转换
        (HTML / md 等)
  - id: out
    type: end
    rank: 5
    lane: 0
    label:
      en: |-
        Local zip / dir
        of archived articles
      zh: |-
        本地 zip / 目录
        归档文章
  edges:
  - {from: input, to: auth}
  - {from: auth, to: list}
  - {from: list, to: fetch}
  - {from: fetch, to: format}
  - {from: format, to: out}
