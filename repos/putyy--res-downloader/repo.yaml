workflow_diagram:
  layout: linear
  why_layer:
    en: |
      Molecule — fixed pipeline (URL parse → platform plugin → signing → download → storage). User picks a URL; routing is deterministic by URL pattern matching, not by LLM at runtime.
    zh: |
      分子 —— 固定流水线(URL 解析 → 平台插件 → 签名 → 下载 → 存储)。用户给 URL;路由按 URL 模式匹配确定,运行时无 LLM。
  nodes:
  - id: input
    type: start
    rank: 0
    lane: 0
    label:
      en: |-
        Share URL paste
        (any of 9 platforms)
      zh: |-
        贴分享 URL
        (9 类平台之一)
  - id: parse
    type: atom
    rank: 1
    lane: 0
    label:
      en: |-
        URL parse + platform identify
      zh: |-
        URL 解析 + 平台识别
  - id: plugin
    type: atom
    rank: 2
    lane: 0
    label:
      en: |-
        Per-platform plugin
        (signing / API)
      zh: |-
        各平台插件
        (签名 / API)
  - id: download
    type: atom
    rank: 3
    lane: 0
    label:
      en: |-
        Resource download
      zh: |-
        资源下载
  - id: out
    type: end
    rank: 4
    lane: 0
    label:
      en: |-
        File on disk
      zh: |-
        文件落盘
  edges:
  - {from: input, to: parse}
  - {from: parse, to: plugin}
  - {from: plugin, to: download}
  - {from: download, to: out}
