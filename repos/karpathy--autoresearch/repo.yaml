workflow_placements:
- workflow_id: park-development-v1
  stage_id: 01_research
  role: reference
  reason:
    en: Research-loop reference — LLM-training research, not general code research, but the autonomous-research pattern is the canonical example.
    zh: 研究循环参考 —— LLM 训练研究,不是通用代码研究,但自主研究模式是规范例子。
workflow_diagram:
  layout: linear
  why_layer:
    en: |
      Compound — the agent decides at runtime what to edit in train.py and what to try next based on observed val_bpb. The pipeline shape is fixed (edit → run → evaluate → keep/discard), but the content of each iteration is LLM-routed.
    zh: |
      Compound —— agent 在运行时决定 train.py 改什么、根据观察到的 val_bpb 决定下一步试什么。流水线形状固定（改 → 跑 → 评估 → 留 / 丢），但每次迭代的内容由 LLM 路由。
  nodes:
  - id: program
    type: start
    rank: 0
    lane: 0
    label:
      en: "program.md\n(skill = agent\ninstructions)"
      zh: "program.md\n(skill = agent\n指令)"
  - id: edit
    type: atom
    rank: 1
    lane: 0
    label:
      en: "Agent edits\ntrain.py\n(one file only)"
      zh: "Agent 改\ntrain.py\n(只改一个文件)"
  - id: run
    type: atom
    rank: 2
    lane: 0
    label:
      en: "uv run train.py\n(5-min budget)"
      zh: "uv run train.py\n(5 分钟预算)"
  - id: parse
    type: atom
    rank: 3
    lane: 0
    label:
      en: "Parse val_bpb\n(lower = better)"
      zh: "解析 val_bpb\n(越低越好)"
  - id: decide
    type: atom
    rank: 4
    lane: 0
    label:
      en: "Keep or revert\n+ journal entry"
      zh: "保留或回滚\n+ 日志记录"
  - id: loop
    type: end
    rank: 5
    lane: 0
    label:
      en: "Next iteration\n(~100 / night\non H100)"
      zh: "下一轮迭代\n(H100 一晚\n约 100 次)"
  edges:
  - {from: program, to: edit}
  - {from: edit, to: run}
  - {from: run, to: parse}
  - {from: parse, to: decide}
  - {from: decide, to: loop}
  - {from: loop, to: edit}
