workflow_diagram:
  layout: linear
  why_layer:
    en: |
      Molecule — fixed pipeline (HTTP request → URL parse → asset-class router → per-vendor provider → normalise to OHLCV → return JSON). Provider selection is by URL pattern, not LLM at runtime.
    zh: |
      分子 —— 固定流水线(HTTP 请求 → URL 解析 → 资产类别路由 → 各 vendor provider → 归一化为 OHLCV → 返 JSON)。provider 选择按 URL 模式匹配,运行时无 LLM。
  nodes:
  - id: input
    type: start
    rank: 0
    lane: 0
    label:
      en: |-
        HTTP GET
        /api/candles/<class>/<ticker>
      zh: |-
        HTTP GET
        /api/candles/<类>/<ticker>
  - id: route
    type: atom
    rank: 1
    lane: 0
    label:
      en: |-
        Asset-class router
      zh: |-
        资产类别路由
  - id: provider
    type: atom
    rank: 2
    lane: 0
    label:
      en: |-
        Per-vendor provider
        (4: tushare/yahoo/binance/commodity)
      zh: |-
        各 vendor provider
        (4 家)
  - id: normalise
    type: atom
    rank: 3
    lane: 0
    label:
      en: |-
        Normalise to OHLCV
      zh: |-
        归一化到 OHLCV
  - id: out
    type: end
    rank: 4
    lane: 0
    label:
      en: |-
        OHLCV JSON
      zh: |-
        OHLCV JSON
  edges:
  - {from: input, to: route}
  - {from: route, to: provider}
  - {from: provider, to: normalise}
  - {from: normalise, to: out}
