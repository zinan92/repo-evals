workflow_diagram:
  layout: linear
  why_layer:
    en: |
      Molecule — 3 fixed atoms (character → outfit-transfer → motion-transfer). pipeline.py executes them in order; no LLM-runtime routing. RunningHub does the AI generation but the pipeline orchestration is deterministic.
    zh: |
      分子 —— 3 个固定原子(角色 → 服装迁移 → 动作迁移)。pipeline.py 顺序执行;运行时没有 LLM 路由。RunningHub 做 AI 生成,但 pipeline 编排是确定性的。
  nodes:
  - id: input
    type: start
    rank: 0
    lane: 0
    label:
      en: |-
        character PNG +
        outfit PNG +
        motion MP4
      zh: |-
        人物 PNG +
        服装 PNG +
        动作 MP4
  - id: char
    type: atom
    rank: 1
    lane: 0
    label:
      en: |-
        Character setup
        (RunningHub seed)
      zh: |-
        角色 setup
        (RunningHub seed)
  - id: outfit
    type: atom
    rank: 2
    lane: 0
    label:
      en: |-
        Outfit transfer
        (RunningHub call 2)
      zh: |-
        服装迁移
        (RunningHub call 2)
  - id: motion
    type: atom
    rank: 3
    lane: 0
    label:
      en: |-
        Motion transfer
        (RunningHub call 3)
      zh: |-
        动作迁移
        (RunningHub call 3)
  - id: out
    type: end
    rank: 4
    lane: 0
    label:
      en: |-
        Output MP4
        + run.json log
      zh: |-
        输出 MP4
        + run.json 日志
  edges:
  - {from: input, to: char}
  - {from: char, to: outfit}
  - {from: outfit, to: motion}
  - {from: motion, to: out}
