notes: 'Electron desktop AI workspace for Xiaohongshu (小红书) creators. Ships as

  signed DMG / EXE / DEB installers (v1.11.0 at scaffold time). Bundles a

  built-in browser, local knowledge base + retrieval, multi-workspace

  editor, RedClaw automation console (LLM-driven), image generation, and

  scheduled background execution. Source layout: desktop/ (Electron),

  Plugin/ (browser extension), RedBoxweb/ (marketing site).


  Compound-layer eval: the call graph for a RedClaw run is decided at

  runtime by the LLM, so eval is scenario-driven. Each scenario asks the

  user to install the binary, configure an endpoint/key/model, and log

  what they observe.


  Source-readable claims (browser-extension manifest, Electron entry,

  README install steps) can be evaluated statically; the AI workspace

  flows require a real install + provider key.


  License caveat: LICENSE file is "MIT — Non-Commercial Use Only" — a

  modified MIT that prohibits commercial use without written permission.

  GitHub returns license=NOASSERTION because the modification breaks

  SPDX recognition. Treat as source-available, not commercial-OSS.

  '
product_view:
  one_liner:
    en: An Electron desktop AI workspace for Xiaohongshu creators — built-in browser captures content from XHS / YouTube / web into a local knowledge base, AI editor drafts manuscripts, RedClaw automation console runs scheduled / long-running tasks, and image+video generation feeds the publish pipeline. BYO LLM endpoint + key.
    zh: 一个面向小红书创作者的 Electron 本地 AI 工作台 —— 内置浏览器从小红书 / YouTube / 网页抓内容进本地知识库，AI 编辑器写稿，RedClaw 自动化控制台跑定时和长周期任务，生图 + 生视频接发布链路。LLM endpoint + key 自带。
  best_for:
    en: Xiaohongshu (XHS) creators who want a desktop AI workspace combining browser + KB + editor + automation in one signed installer, comfortable bringing their own LLM endpoint + key.
    zh: 想要桌面 AI 工作台（浏览器 + 知识库 + 编辑器 + 自动化）一站式做小红书的创作者；能装签名 DMG / EXE / DEB、能在 Settings 里配 LLM endpoint + key。
  watch_out:
    en: |
      LICENSE is "MIT — Non-Commercial Use Only" (a modified MIT) — fine for personal use, but you cannot redistribute or fork commercially without written permission from the author. The README claims YouTube capture, but the browser-extension manifest's host_permissions does NOT include *.youtube.com — that capture path will silently fail until fixed. RedClaw automation runs on your real XHS account; never let it loose on a primary account before testing on a burner. Compound-layer flows (KB → editor → publish, RedClaw multi-step) are LLM-runtime-routed and unverified by static eval — the published binary works, but the agent's call graph at runtime is opaque.
    zh: |
      LICENSE 是「MIT —— 仅限非商业使用」（改过的 MIT）—— 个人用没问题，但商用 / 二次分发需作者书面授权。README 写了能抓 YouTube，但浏览器扩展 manifest 的 host_permissions 里没有 *.youtube.com —— 这条抓取路径会静默失败直到修复。RedClaw 自动化在你真实小红书账号上跑；先在小号验证再上主号。Compound 层的流程（KB → 编辑器 → 发布、RedClaw 多步）是 LLM-runtime 路由，静态评测验证不了 —— 发布的 binary 能装能跑，但运行时 agent 的调用图不透明。
  use_for:
  - en: Xiaohongshu (XHS) creators who want a desktop AI workspace combining browser
      + KB + editor + automation.
    zh: 想要桌面 AI 工作台（浏览器 + 知识库 + 编辑器 + 自动化）一站式做小红书的创作者。
  - en: Comfortable installing a signed DMG / EXE / DEB and configuring your own LLM
      endpoint + key.
    zh: 能装签名 DMG / EXE / DEB、能在 Settings 里配 LLM endpoint + key。
  dont_use_for:
  - en: Don't expect YouTube capture to work — manifest description claims it, but
      host_permissions don't grant *.youtube.com.
    zh: 别指望 YouTube 抓取能用 —— 扩展 description 写了，但 host_permissions 里没 youtube.com。
  - en: Don't run RedClaw automation on a real account without verifying it on a test
      account first.
    zh: 别在真实账号上直接跑 RedClaw 自动化 —— 先在小号验证。
  - en: Don't redistribute or fork commercially — LICENSE is MIT-NC (non-commercial only).
    zh: 不要商用分发或商用 fork —— LICENSE 是 MIT-NC（仅限非商业）。
  persona:
    en: Xiaohongshu solo creator or small content team that already produces a few image notes / videos a week and wants a single local desktop app to handle capture → knowledge base → drafting → image + video → scheduled posting, instead of juggling 5 SaaS subscriptions.
    zh: 已经每周产出若干图文 / 视频的小红书个人创作者或小内容团队。想要一个本地桌面 app 一站式做完抓取 → 知识库 → 写稿 → 生图 + 生视频 → 定时发布，不想再同时订 5 个 SaaS。
  scenario:
    en: Tuesday morning you save 8 trending XHS notes via the Plugin, "wander" them in the local KB to spark a topic, draft 3 manuscripts in the editor, generate cover images, queue them in RedClaw to publish across the week, then close the laptop — RedClaw keeps running.
    zh: 周二早晨用插件保存 8 条热门小红书笔记进本地知识库，「漫步」碰撞出选题，在编辑器里起 3 篇稿、生封面图、扔进 RedClaw 队列让它一周内分批发出，关掉笔记本 —— RedClaw 在后台继续跑。
  without_this:
    en: You stitch together a clipper extension + Notion KB + ChatGPT for drafting + Midjourney/DALL-E for images + a separate scheduler — five tools, five subscriptions, hand-copy between them.
    zh: 你拼一个剪藏扩展 + Notion 知识库 + ChatGPT 写稿 + Midjourney/DALL-E 生图 + 独立的定时发布工具 —— 5 个工具、5 份订阅、彼此之间手动倒腾。
  with_this:
    en: One signed installer, one Settings panel for endpoint + key + model, one app that owns the full workflow from capture to scheduled publish. Browser, KB, editor, image gen, RedClaw automation all share state.
    zh: 一个签名安装器、一个 Settings 面板配 endpoint + key + model、一个 app 端到端管完整流程。浏览器 / 知识库 / 编辑器 / 生图 / RedClaw 自动化共享同一份状态。
  cost_summary:
    en: App is free for personal use (LICENSE is MIT-NC, no commercial use). You bring your own LLM endpoint + key — Anthropic / OpenAI / Google / openai-compatible all supported via Vercel AI SDK v6. Image / video generation costs depend on the model you point it at (e.g. GPT-image-2 is paid).
    zh: App 个人用免费（LICENSE 是 MIT-NC，禁商用）。LLM endpoint + key 自带 —— 通过 Vercel AI SDK v6 支持 Anthropic / OpenAI / Google / openai-compatible。生图 / 生视频成本看你接哪家模型（比如 GPT-image-2 是付费的）。
  how:
    en: |
      1. Download the signed DMG / EXE / DEB from https://github.com/Jamailar/RedBox/releases
      2. Install + open the app, go to Settings → AI, fill in Endpoint + Key + Model, test connection
      3. Pick or create a workspace
      4. Load the unpacked browser extension from `Plugin/` in Chrome / Edge developer mode
      5. From "浏览器插件 → 知识库 → 漫步 / 稿件 / RedClaw" run an end-to-end workflow once to validate
    zh: |
      1. 在 https://github.com/Jamailar/RedBox/releases 下载签名 DMG / EXE / DEB
      2. 装 + 打开 app，进 Settings → AI 填 Endpoint + Key + Model，测连接
      3. 选或新建工作空间
      4. 在 Chrome / Edge 开发者模式里加载 `Plugin/` 目录里的解压扩展
      5. 从「浏览器插件 → 知识库 → 漫步 / 稿件 / RedClaw」端到端跑一次工作流验证
  examples:
  - context:
      en: Capture trending XHS notes into local KB, then "wander" to spark a new topic
      zh: 抓热门小红书笔记进本地知识库，再「漫步」碰撞出新选题
    you_say:
      en: "[click] Plugin → save 8 XHS image notes → open KB → click 'Wander' on tag=美食"
      zh: "[点击] 插件 → 保存 8 条小红书图文笔记 → 打开知识库 → 标签=美食 → 点「漫步」"
    what_happens:
      en: "Plugin pushes the 8 notes (text + images) into local KB. Wander randomly draws across them and asks the LLM to propose 3 fresh angles. Each angle can be promoted into a draft in the editor with one click."
      zh: "插件把 8 条笔记（文本 + 图片）推进本地知识库。「漫步」随机抽取并让 LLM 提 3 个新角度。每个角度可一键进编辑器变草稿。"
  - context:
      en: Kick off RedClaw to draft + cover + schedule a week of posts
      zh: 启动 RedClaw 一周内分批起稿 + 出封面 + 定时发布
    you_say:
      en: "Open RedClaw → 'plan 5 posts for the next 7 days from this week's KB highlights, generate covers, queue for 9am daily'"
      zh: "打开 RedClaw → 「按本周知识库重点排 5 条未来 7 天的笔记，生封面，每天 9 点排队」"
    what_happens:
      en: "RedClaw plans 5 drafts, calls the editor for each, calls image-gen for covers, schedules them. Background runner keeps the schedule even after the main window closes. Compound-layer — actual call graph is LLM-decided at runtime."
      zh: "RedClaw 规划 5 篇草稿，调用编辑器生成每篇，调图生成出封面，全部排队。主窗口关闭后后台 runner 继续跑日程。Compound 层 —— 实际调用图由 LLM 在运行时决定。"
  - context:
      en: Use your existing OpenAI-compatible endpoint instead of a hosted vendor
      zh: 用自己的 OpenAI 兼容 endpoint 替代托管供应商
    you_say:
      en: "Settings → AI → set endpoint=https://my-proxy/v1, key=..., model=gpt-4o-mini → Test"
      zh: "Settings → AI → 填 endpoint=https://my-proxy/v1、key=...、model=gpt-4o-mini → 测试"
    what_happens:
      en: "RedBox uses Vercel AI SDK v6 + openai-compatible adapter — any OpenAI-shaped endpoint works. Lets you front-run a private LLM proxy or self-hosted model."
      zh: "RedBox 用 Vercel AI SDK v6 + openai-compatible 适配器 —— 任何 OpenAI 形态的 endpoint 都行。可以接自建 LLM 代理或自托管模型。"
  next_step:
    en: |
      Three actions to lift the score: (a) fix the YouTube capture gap — the manifest description claims YouTube but host_permissions doesn't include *.youtube.com (claim-002 passed_with_concerns); (b) record a compound-layer scenario log for the end-to-end capture→KB→editor→publish flow + the RedClaw single-session task — these are 4 of the 7 claims sitting at `untested`; (c) clarify the "MIT — Non-Commercial Use Only" license in the README + add a CONTRIBUTING note explaining what counts as commercial — currently README MIT badge contradicts the actual LICENSE file text.
    zh: |
      三个加分动作：(a) 修 YouTube 抓取的缺口 —— manifest description 写了但 host_permissions 没 *.youtube.com（claim-002 passed_with_concerns）；(b) 录一份 compound 层场景日志覆盖端到端 capture→KB→editor→publish 流和 RedClaw 单 session 任务 —— 这是 7 条 claim 里 4 条 `untested`；(c) 在 README 里讲清「MIT —— 仅限非商业」许可，加 CONTRIBUTING 说明什么算商用 —— 目前 README MIT 徽章和 LICENSE 实际文本互相打架。
