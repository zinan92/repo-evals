workflow_diagram:
  layout: mesh
  why_layer:
    en: |
      Compound — RedClaw's call graph is decided by the LLM at runtime. The static modules (browser, KB, editor, image-gen) interconnect freely; what gets called when depends on the agent's plan, not a fixed pipeline.
    zh: |
      Compound —— RedClaw 的调用图由 LLM 在运行时决定。静态模块（浏览器、知识库、编辑器、生图）之间互联自由；什么时候调用什么由 agent 计划决定，不是固定流水线。
  nodes:
  - id: browser
    type: start
    rank: 0
    lane: 0
    label:
      en: "Browser plugin\n(XHS / YouTube /\nweb capture)"
      zh: "浏览器插件\n(小红书 / YouTube /\n网页抓取)"
  - id: kb
    type: atom
    rank: 1
    lane: 0
    label:
      en: "Local KB\n(content + tags +\nsearch)"
      zh: "本地知识库\n(内容 + 标签 +\n搜索)"
  - id: wander
    type: atom
    rank: 2
    lane: 0
    label:
      en: "Wander\n(topic spark)"
      zh: "漫步\n(选题碰撞)"
  - id: editor
    type: atom
    rank: 2
    lane: 1
    label:
      en: "AI editor\n(manuscript)"
      zh: "AI 编辑器\n(稿件工作台)"
  - id: imagegen
    type: atom
    rank: 2
    lane: 2
    label:
      en: "Image / video\ngeneration"
      zh: "生图 / 生视频"
  - id: redclaw
    type: atom
    rank: 3
    lane: 1
    label:
      en: "RedClaw\n(LLM-routed\nautomation)"
      zh: "RedClaw\n(LLM 路由\n自动化)"
  - id: publish
    type: end
    rank: 4
    lane: 1
    label:
      en: "Scheduled XHS\npublish (real\naccount session)"
      zh: "定时小红书发布\n(真实账号会话)"
  edges:
  - {from: browser, to: kb}
  - {from: kb, to: wander}
  - {from: kb, to: editor}
  - {from: kb, to: imagegen}
  - {from: wander, to: editor}
  - {from: editor, to: redclaw}
  - {from: imagegen, to: redclaw}
  - {from: editor, to: publish}
  - {from: redclaw, to: publish}
