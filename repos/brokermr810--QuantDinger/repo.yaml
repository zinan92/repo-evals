version_tested: main@HEAD (3.0.3)
notes: 'Self-hosted full-stack AI quant trading platform. 4-service Docker

  Compose stack: postgres + redis + Flask backend (Python 3.12) +

  prebuilt React frontend. Adds a separate MCP server (quantdinger-mcp

  v0.1.0, requires-python>=3.10) for Cursor / Claude Code / Codex /

  OpenClaw / NanoBot integration. Apache 2.0, version 3.0.3, also

  available as AWS Marketplace AMI.


  Multi-broker integration in backend requirements: ccxt (crypto),

  ib_insync (IBKR stocks), MetaTrader5 (forex, Windows-only). Multi-LLM

  via env: OpenAI, DeepSeek, Grok (with custom BASE_URL each).


  Compound layer: AI strategy generation, indicator generation,

  ensemble/calibration/reflection, multi-agent research are all

  LLM-driven at runtime. Per the framework''s compound rule, eval is

  scenario-driven and capped at usable until ≥1 logged scenario.

  '
product_view:
  one_liner:
    en: 'A self-hosted Docker Compose stack for AI-assisted quantitative trading: charting, indicator and strategy generation, backtesting, and live execution across crypto / IBKR stocks / MT5 forex — talks to your AI agent through an MCP server, brings its own Postgres + Redis + Flask backend + React frontend.'
    zh: 一个自托管的 AI 量化交易 Docker Compose 平台：行情图表、AI 辅助生成指标和策略、回测、加密货币 / IBKR 美股 / MT5 外汇实盘下单都在一套 stack 里。通过 MCP server 接你的 AI Agent，自带 Postgres + Redis + Flask 后端 + React 前端。
  persona:
    en: A solo quant or small trading-team founder who wants their own AI-assisted backtesting + live execution stack — without giving an external SaaS their broker keys, strategies, or trade history. Comfortable running Docker Compose and connecting at least one broker (IBKR for US stocks, MT5 for forex, or a crypto exchange).
    zh: 独立量化或小团队创始人,想要自己的 AI 辅助回测 + 实盘执行 stack —— 不想把 broker key / 策略 / 交易记录给外部 SaaS。能跑 Docker Compose,能接至少一家 broker(IBKR 美股 / MT5 外汇 / 加密所)。
  scenario:
    en: You have an idea ("buy on RSI dips, exit on MA20 cross"), want to test it on 3 years of data, iterate the rules, then put a small live position. You want the AI to write the indicator code + the strategy code so you don't hand-code each variation, but you want the keys + the server in your control.
    zh: 你有想法("RSI 回调买入,MA20 上穿离场"),想用 3 年数据回测,迭代规则,然后挂一个小仓位实盘。你希望 AI 替你写 indicator 代码 + 策略代码省得每次手写,但 key + 服务器在你自己手里。
  without_this:
    en: Three options, each costly. (1) Use a SaaS quant platform (QuantConnect, Backtest.io) — gives them your strategies + history; data leaks risk. (2) Hand-stitch QuantLib + a charting lib + your broker's SDK + a Postgres + a Redis — weeks of plumbing before any backtest. (3) Pay an Interactive Brokers prop firm to do it — gives away your edge.
    zh: 三条路,代价都高。(1) 用 SaaS 量化平台(QuantConnect / Backtest.io)—— 把策略 + 历史给他们,有数据泄漏风险。(2) 自己拼 QuantLib + 图表库 + broker SDK + Postgres + Redis —— 几周接管道才能开始第一次回测。(3) 找 prop firm 替你做 —— 把 edge 拱手让人。
  with_this:
    en: 'One docker-compose. AI agent talks via MCP to a 4-service stack (Flask backend + React frontend + Postgres + Redis). Workflow: "design indicator" → AI writes code, runs it on your data → "run backtest" → AI evaluates results, adjusts → optional "go live" with manual-approval gate. IBKR for US stocks, MT5 for forex (Windows-only), Coinbase / Binance for crypto.'
    zh: '一个 docker-compose。AI agent 通过 MCP 对接 4 服务 stack(Flask 后端 + React 前端 + Postgres + Redis)。工作流: "设计 indicator"→ AI 写代码 + 跑你的数据 → "回测"→ AI 评估结果调整 → 可选"上实盘"带人工审批闸门。IBKR 美股 / MT5 外汇(Windows-only)/ Coinbase / Binance 加密。'
  cost_summary:
    en: 'MIT, free OSS. You pay for: (1) one of LLM providers (OpenAI / DeepSeek / Grok) for code generation; (2) broker accounts (IBKR / MT5 / crypto) you''d already have. AWS Marketplace AMI exists if you don''t want to manage Docker yourself (paid).'
    zh: 'MIT 免费开源。你付: (1) LLM provider(OpenAI / DeepSeek / Grok)三选一,用于代码生成;(2) 已有的 broker 账号(IBKR / MT5 / 加密所)。不想自己管 Docker 可买 AWS Marketplace AMI(付费)。'
  watch_out:
    en: 'OSS repo and commercial product (ai.quantdinger.com SaaS / AMI / paid tier) overlap; check which features are open-source vs gated. MetaTrader5 is Windows-only by design — Linux server can''t do forex without a separate Windows MT5 host. Default `postgres123` password + 127.0.0.1 binding are dev-only — never public-VPS without reverse proxy + secret rotation. Real-money execution: don''t enable `AGENT_LIVE_TRADING_ENABLED` until you''ve verified the manual-approval gate yourself on paper trades.'
    zh: '开源仓库和商业产品(ai.quantdinger.com SaaS / AMI / 付费层)有重叠,看清哪些是开源、哪些是付费。MetaTrader5 设计上 Windows-only —— Linux 服务器跑不了外汇,得单起一台 Windows。默认 `postgres123` + 127.0.0.1 绑定只够开发,不加反代 + 不轮换密钥别公网。实盘: 没在 paper 账号验证过人工审批闸门前,别开 `AGENT_LIVE_TRADING_ENABLED`。'
  examples:
  - context:
      en: A solo quant testing a "buy on RSI<30, sell on MA20 cross" strategy on SPY data
      zh: 独立量化测试"RSI<30 买入 / MA20 上穿卖出"策略,用 SPY 数据
    you_say:
      en: 'Design an indicator: RSI(14) on SPY daily. Then write a strategy that buys when RSI<30 and sells when price crosses above MA20. Backtest 2020-2025.'
      zh: '设计 indicator: SPY 日线 RSI(14)。然后写一个策略,RSI<30 买入,价格上穿 MA20 卖出。回测 2020-2025。'
    what_happens:
      en: 'AI agent generates the RSI calculation in Python, registers it, runs it on your loaded SPY data. Then writes the strategy code, runs backtest engine, returns Sharpe / drawdown / trade count / equity curve. You see it: 47 trades, Sharpe 0.6, max drawdown 18%. You ask AI to add a stop-loss; it iterates.'
      zh: 'AI agent 生成 RSI 计算的 Python 代码,注册进去,在你已加载的 SPY 数据上跑。然后写策略代码,跑回测引擎,返回 Sharpe / 回撤 / 交易笔数 / 权益曲线。你看到: 47 笔交易,Sharpe 0.6,最大回撤 18%。你让 AI 加止损,迭代。'
  - context:
      en: A small trading team comparing a basket of 5 strategies for crypto perp futures
      zh: 小团队比较一组 5 个加密永续合约策略
    you_say:
      en: Run all 5 strategies in our /strategies folder against BTC/USD perp last 6 months, give me a comparison table
      zh: 把 /strategies 文件夹里 5 个策略全部在 BTC/USD 永续合约近 6 个月数据上跑一遍,给我对比表
    what_happens:
      en: Backtest engine runs all 5 in parallel containers, aggregates results into a comparison view (Sharpe / Calmar / max DD / win rate / avg trade duration). You see 2 strategies have similar Sharpe but very different max DD; you discard the higher-DD one.
      zh: 回测引擎并行跑 5 个,把结果聚合成对比视图(Sharpe / Calmar / 最大回撤 / 胜率 / 平均持仓时长)。你看到 2 个策略 Sharpe 相近但最大回撤差异大;舍弃高回撤那个。
  - context:
      en: A founder who validated a strategy on paper trading and wants to go live with $1000 real on IBKR
      zh: 创始人在 paper 账号验证完一个策略,想在 IBKR 上拿 1000 美元真钱实盘
    you_say:
      en: Set this strategy live on my IBKR paper account first; manual-approval gate must be ON. Show me each entry signal before I confirm.
      zh: 把这个策略上 IBKR paper 账号实盘,人工审批闸门必须开。每个入场信号先给我看,我确认才下单。
    what_happens:
      en: AI generates entry / exit signals based on live data; queues each in the dashboard with a "approve / reject" button. You see what's about to happen + you click. After 2 weeks of paper-account approval rounds, you flip to real account, $1000 cap. Manual gate stays on for safety.
      zh: AI 根据实时数据出入场 / 离场信号,在 dashboard 排队,每个带"批准 / 拒绝"按钮。你看清楚要发生什么再点。paper 账号上跑两周审批后,切真账号,1000 美元上限。人工闸门继续开,以防万一。
  how:
    en: '`docker compose up -d --build` (or AWS Marketplace AMI for paid one-click). Configure broker keys (IBKR for US stocks, MT5 for forex on a Windows host, crypto exchange) + at least one LLM provider (OpenAI / DeepSeek / Grok). Open the React dashboard, connect your AI agent via MCP. Workflow: "design indicator" → AI writes Python code → "run backtest on this strategy" → AI evaluates → optional "go live" with manual-approval gate forced ON.'
    zh: '`docker compose up -d --build`(或买 AWS Marketplace AMI 一键)。配 broker key(IBKR 美股 / MT5 外汇要 Windows / 加密所) + 至少一家 LLM(OpenAI / DeepSeek / Grok)。开 React dashboard,通过 MCP 接 AI agent。工作流:"设计 indicator" → AI 写 Python → "跑这个策略回测" → AI 评估 → 可选"上实盘"必须开人工审批闸门。'
  next_step:
    en: Run a backtest on a known-good strategy (RSI dip + MA20 cross on SPY 2020-2025). Verify Sharpe / drawdown match a hand-calculated baseline within ±5%. Then a paper-account live test on IBKR for 2 weeks with manual-approval gate ON. Validates backtest + execution layer + the safety gate.
    zh: 在一个已知策略上跑回测(SPY 2020-2025 上的 RSI 回调 + MA20 上穿)。验证 Sharpe / 回撤跟手算基线差距 ±5% 以内。然后在 IBKR 的 paper 账号上跑 2 周实盘,人工审批闸门必须开。验证回测 + 执行层 + 安全闸门。
