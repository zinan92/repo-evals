workflow_diagram:
  layout: tree
  why_layer:
    en: 'Compound — at three diamond decision nodes, the LLM (or AI agent

      via MCP) decides at runtime which path to take based on your

      request and the data it sees. (1) "Design indicator or use existing?"

      — branches to AI codegen vs library. (2) "Backtest looks promising

      or needs adjustment?" — branches to live-prep vs iterate. (3)

      "Live-trade approval — who decides?" — branches to AI-pre-flight

      vs human-veto. A molecule would have a fixed pipeline; a compound

      has runtime LLM-driven branches.'
    zh: 复合物 —— 在 3 个菱形决策节点上,LLM(或通过 MCP 的 AI agent)运行时根据请求和数据决定走哪条路。(1)"需要新 indicator?" 分到 AI 代码生成 vs 现成库;(2)"回测够好了 or 继续迭代?" 分到上实盘准备 vs 调整;(3)"实盘审批 —— 谁决定?" 分到 AI 预审 vs 人工否决。分子是固定流水线;复合物是运行时 LLM 决定的分支。
  nodes:
  - id: ask
    type: start
    rank: 0
    lane: 1
    label:
      en: 'Trading idea

        (e.g., "RSI dip + MA cross")'
      zh: '交易想法

        (比如"RSI 回调 + MA 上穿")'
  - id: dec_indicator
    type: decision
    rank: 1
    lane: 1
    label:
      en: 'Need new indicator?

        (LLM decides)'
      zh: '需要新 indicator?

        (LLM 决定)'
  - id: ai_codegen
    type: atom
    rank: 2
    lane: 0
    label:
      en: 'AI generates indicator code

        (Python, registered)'
      zh: 'AI 生成 indicator 代码

        (Python,注册)'
  - id: backtest
    type: atom
    rank: 3
    lane: 1
    label:
      en: 'Backtest engine

        (your data, your params)'
      zh: '回测引擎

        (你的数据 / 参数)'
  - id: dec_iterate
    type: decision
    rank: 4
    lane: 1
    label:
      en: 'Promising or iterate?

        (LLM evaluates results)'
      zh: '够好 或 迭代?

        (LLM 评估结果)'
  - id: iterate
    type: atom
    rank: 5
    lane: 0
    label:
      en: 'AI adjusts strategy

        (re-run backtest)'
      zh: 'AI 调整策略

        (重跑回测)'
  - id: dec_live
    type: decision
    rank: 6
    lane: 1
    label:
      en: 'Live or paper?

        (manual-approval gate)'
      zh: '实盘 或 paper?

        (人工审批闸门)'
  - id: paper
    type: atom
    rank: 7
    lane: 2
    label:
      en: 'Paper account

        (validate gate)'
      zh: 'paper 账号

        (验证审批闸门)'
  - id: live
    type: end
    rank: 7
    lane: 1
    label:
      en: 'Live execution

        (IBKR / MT5 / crypto)'
      zh: '实盘执行

        (IBKR / MT5 / 加密)'
  edges:
  - from: ask
    to: dec_indicator
  - from: dec_indicator
    to: ai_codegen
    label:
      en: 'yes'
      zh: 是
  - from: dec_indicator
    to: backtest
    label:
      en: 'no'
      zh: 否
  - from: ai_codegen
    to: backtest
  - from: backtest
    to: dec_iterate
  - from: dec_iterate
    to: iterate
    label:
      en: needs work
      zh: 需调整
  - from: iterate
    to: backtest
  - from: dec_iterate
    to: dec_live
    label:
      en: ready
      zh: 够好了
  - from: dec_live
    to: paper
    label:
      en: paper first
      zh: 先 paper
  - from: dec_live
    to: live
    label:
      en: approved
      zh: 已审批
