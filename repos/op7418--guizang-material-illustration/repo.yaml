  - slug: "op7418--guizang-social-card-skill"
    slug_note:
      en: "Same author, the paired LAYOUT layer. guizang-social-card owns the whole card — title, body, theme color, aspect ratio, cover. THIS repo owns only the central illustration that sits inside it. Explicit 配图层 × 排版层 split; use them together (illustration → card)."
      zh: "同作者、配套的排版层。guizang-social-card 负责整张卡片——标题/正文/主题色/尺寸/封面;本 repo 只负责卡片里的中心插画。明确的'配图层 × 排版层'分工,组合使用(先出图 → 再排卡)。"
  - slug: "helloianneo--ian-xiaohei-illustrations"
    slug_note:
      en: "Both make 公众号 illustrations. ian-xiaohei leans to inline 正文配图 / mood images threaded through body text; THIS repo leans to the 'middle explanatory picture' — mechanism/process diagrams, chart beautify, and reference-informed visuals — and insists on in-image Chinese labels + data fidelity. Different lanes: 正文情绪配图 vs 中心解释图/图表."
      zh: "两者都做公众号配图。ian-xiaohei 偏正文内嵌小配图 / 情绪图,穿插在正文里;本 repo 偏'中间那张解释图'——机制/流程图、图表美化、参考辅助视觉——且强调图内中文标签 + 数据保真。不同赛道:正文情绪配图 vs 中心解释图/图表。"
