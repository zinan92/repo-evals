# Claim map for guizang-material-illustration (prompt-skill).
# SUPPORT layer = static, verifiable facts (references, coherence, templates,
#   protocols, QA, boundary, license) — fully checkable without running a model.
# CORE layer = the real user outcome is an IMAGE rendered by an EXTERNAL image
#   model this eval had no credentials to run → image-model-dependent, UNTESTED.
# Statuses reflect the 2026-07-09 static eval (Mark, for Park / Vera).

claims:
  # --- SUPPORT layer (static, verifiable) --------------------------------

  - id: claim-001
    user_icon: "🔗"
    user_title:
      en: "The skill is structurally sound — no broken references"
      zh: "skill 结构完整——没有断链"
    user_description:
      en: "Every file SKILL.md points at (6 references + assets/prompt-template.md) exists, and the YAML frontmatter is valid. An agent following the skill never hits a missing file and falls back to guessing."
      zh: "SKILL.md 引用的每个文件(6 个 reference + assets/prompt-template.md)都存在,frontmatter 合法。agent 按 skill 走不会撞空文件、退化成瞎猜。"
    title: SKILL.md 引用完整性 + frontmatter 合法(结构关)
    source: SKILL.md
    source_ref: "Visual System / File Handling 引用的 references/*.md + assets/prompt-template.md"
    priority: critical
    area: skill-integrity
    statement: |
      SKILL.md 引用的 6 个 reference(visual-style / prompt-patterns / chart-beautify /
      use-cases-and-routing / reference-gathering / qa-checklist)与 assets/prompt-template.md
      全部存在;frontmatter(name / description)合法非空。
    evidence_needed: |
      比对 SKILL.md 引用与仓库文件树;解析 frontmatter。
    status: passed
    evidence: |
      文件树核对:6 个 references/*.md + assets/prompt-template.md 全部存在,0 断链。
      frontmatter name=guizang-material-illustration、description(含大量中英触发词)齐全合法。
      失效场景(未发生):任一 reference 缺失 → agent 读不到风格/图表/QA 规则 → skill 崩。

  - id: claim-002
    user_icon: "🧩"
    user_title:
      en: "The reference docs are coherent, not contradictory"
      zh: "参考文档彼此一致、不打架"
    user_description:
      en: "The 6 reference files divide the work cleanly (style / prompt structures / chart / routing / reference lookup / QA) and don't contradict each other — labels ≤5 chars, one accent per set, data-preservation, no-fake-logos rules are stated consistently across files."
      zh: "6 个 reference 分工清晰(风格/提示结构/图表/路由/参考/QA)、互不矛盾——标签≤5 字、每组一个强调色、数据保真、不贴假 logo 等规则在各文件里说法一致。"
    title: references 内部一致、非矛盾
    source: references/*.md
    source_ref: "visual-style / prompt-patterns / chart-beautify / use-cases-and-routing / reference-gathering / qa-checklist"
    priority: high
    area: skill-coherence
    statement: |
      6 个 reference 的规则(标签长度、强调色、数据保真、参考只补事实不抄风格、
      不贴假 logo、社交卡尺寸可读)彼此一致,无自相矛盾。
    evidence_needed: |
      通读 6 个 reference,核对交叉规则一致性。
    status: passed
    evidence: |
      通读全部 6 个 reference:标签"2-5 字/3-5 个"、"每组一个 accent"、"只抽图表语义不继承截图样式"、
      "参考只提取事实与视觉线索"、"不贴 flat logo 除非明确要求"在多处一致复述,无冲突。
      失效场景(未发生):某文件说标签越多越好、另一文件说越少越好 → agent 无所适从。

  - id: claim-003
    user_icon: "🧱"
    user_title:
      en: "Ready-to-fill, constraint-rich prompt scaffolds are provided"
      zh: "提供可直接填空、约束齐全的提示词外壳"
    user_description:
      en: "assets/prompt-template.md + prompt-patterns.md give a complete image-prompt shell plus 5 diagram structures (cycle / pipeline / hub / before-after / layer) and goal/time variants — each with exact-label, aspect-ratio, safe-margin and negative-constraint slots. The agent fills brackets, it doesn't invent structure."
      zh: "assets/prompt-template.md + prompt-patterns.md 给出完整图像提示词外壳,外加 5 种图解结构(循环/管线/hub/前后/分层)与 goal/time 变体——每种都带精确标签、比例、安全区、负向约束的槽位。agent 只需填空,不必自造结构。"
    title: 完整约束型提示词模板 + 图解结构库
    source: assets/prompt-template.md + references/prompt-patterns.md
    source_ref: "Base Prompt Shell / Cycle / Pipeline / Hub / Before-After / Layer / Label Repair"
    priority: high
    area: prompt-scaffold
    statement: |
      提供可直接填空的图像提示词外壳(含精确标签文字、比例、安全区、负向约束)与至少 5 种
      可复用图解结构模板。
    evidence_needed: |
      核对 prompt-template.md + prompt-patterns.md 的模板完整度。
    status: passed
    evidence: |
      prompt-template.md 是一份完整 base shell(Use case / Asset type / Primary request /
      Chinese labels / Style / Composition / Lighting / Constraints);prompt-patterns.md 另有
      cycle/pipeline/goal-evaluator/time-check/hub/before-after 6 个结构 + label-repair 重生模板。
      即 agent 拿到的是"填空题"而非"作文题"。

  - id: claim-004
    user_icon: "📊"
    user_title:
      en: "A rigorous 'never fake the data' chart protocol is written down"
      zh: "图表'不编数据'协议写得很硬"
    user_description:
      en: "chart-beautify.md extracts only chart semantics (type / title / values / axis / units / order / error bars), discards screenshot styling, mandates a Required-chart-accuracy block listing every exact value, and a 'reject if numerically wrong' QA. This is the discipline that stops invented numbers — as a written protocol (not a runtime validator)."
      zh: "chart-beautify.md 只抽图表语义(类型/标题/数值/坐标/单位/类别序/误差线),丢掉截图样式,强制 Required chart accuracy 块逐值列明,并有'数据错就拒收'的 QA。这是防编数的纪律——作为书面协议(而非运行时校验器)。"
    title: chart-beautify 数据优先协议 + Required-accuracy 块
    source: references/chart-beautify.md
    source_ref: "Principle / Prompt Requirements / QA Checklist"
    priority: high
    area: chart-protocol
    statement: |
      chart-beautify.md 规定:只抽图表语义、丢弃截图样式、提示词含逐值 Required chart accuracy 块、
      "漂亮但数据错→拒收"的 QA。
    evidence_needed: |
      核对 chart-beautify.md 的抽取/保真/QA 规则完整度。
    status: passed
    evidence: |
      chart-beautify.md 明列 Keep/Discard 清单、Required chart accuracy 逐值示例(y 轴刻度、条高、
      类别名、数值标签精确到具体字符串)、"Do not accept an attractive chart with wrong data"。
      注意:这是提示词纪律 + 人工 QA,不是确定性脚本——真伪仍须人工核(见 claim-010)。

  - id: claim-005
    user_icon: "🎣"
    user_title:
      en: "Trigger metadata is specific (but not live-verified here)"
      zh: "触发元数据写得具体(但本次未在线验证)"
    user_description:
      en: "SKILL.md's description is packed with concrete trigger phrases (配图 / 带字插图 / 解释图 / 图表美化 / process-loop-system diagrams …) and agents/openai.yaml sets allow_implicit_invocation. The design is strong; whether it actually fires (and doesn't mis-fire) needs a live trigger test we did not run."
      zh: "SKILL.md 的 description 塞满具体触发词(配图/带字插图/解释图/图表美化/process-loop-system diagrams…),agents/openai.yaml 设 allow_implicit_invocation。设计到位;是否真触发(且不误触)需要在线 trigger 测试,本次未跑。"
    title: 触发词/隐式调用设计到位(未在线实测)
    source: SKILL.md + agents/openai.yaml
    source_ref: "frontmatter description / policy.allow_implicit_invocation"
    priority: high
    area: triggering
    statement: |
      description 含丰富且具体的中英触发词,openai.yaml 允许隐式调用;设计层面触发覆盖良好。
    evidence_needed: |
      静态核对 description 触发词;(缺)live trigger_test 的 precision/recall。
    status: passed_with_concerns
