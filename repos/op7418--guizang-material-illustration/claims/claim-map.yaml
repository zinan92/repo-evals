      gh api license=null;contents/LICENSE 与 contents/LICENSE.md 均 404 → 确认真的没有许可证。
      默认 all-rights-reserved。→ has_license=false,触发 −2 罚分,并作为采用前必须解决的旗标。
      (记 medium/failed:在账本里显红,但不与 has_license 罚分重复计分。)

