      zh: "没有 LICENSE 文件,GitHub 也报无许可证,所以默认保留所有权利(all-rights-reserved)。在作者补证之前,采用/修改/再分发都处于法律灰区。这是采用阻断旗标,不是表面瑕疵。"
    title: NO LICENSE(采用阻断旗标)
    source: repo
    source_ref: "gh api license=null; contents/LICENSE + LICENSE.md → 404"
    priority: medium
    area: support-license
    statement: |
      仓库应带一个可用的开源许可证,授权采用方使用/修改/再分发。
    evidence_needed: |
