    title: 核心承诺:可用 on-brand 带标签插画
    source: README + SKILL.md
    source_ref: "效果 / Workflow step 6-9"
    priority: critical
    area: core
    statement: |
      按 skill 的提示词计划,外部图像模型渲染出可用、风格统一、标签正确、能解释内容的归藏材质插画。
    evidence_needed: |
      带真实图像模型凭证跑一组题材,按 qa-checklist 对产出打分(可用性/on-brand/标签正确)。
    status: untested
    evidence: |
      未实测:本次评估无图像模型凭证,且不得触碰用户凭证/浏览器(治理约束)。产物质量 image-model-dependent,
      静态不可验。→ core_layer_tested=false。这是把它判 molecule(而非 atom 自动 core_tested=true)的核心原因。

