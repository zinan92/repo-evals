notes: 'Xiaohongshu (小红书) automation skill bundle for OpenClaw / Claude Code.

  5 atomic sub-skills (xhs-auth, xhs-publish, xhs-explore, xhs-interact,

  xhs-content-ops) under skills/, routed by a root SKILL.md. Driven via

  a Chrome MV3 extension ("XHS Bridge") that talks to the Python side

  over a localhost websocket. Uses the user''s real logged-in browser

  session — no platform reverse-engineering, no API key, but also no

  protection against XHS detecting automation.


  Security note: extension permissions include `debugger` (full Chrome

  DevTools attach), `cookies`, `scripting`, and host_permissions for

  xiaohongshu.com domains + `ws://localhost/*`. README explicitly says

  "use real user account" — the privileged Chrome surface is by design

  but worth flagging for users who don''t read manifests.

  '
product_view:
  one_liner:
    en: A 5-skill OpenClaw / Claude Code bundle that automates Xiaohongshu (小红书) — login, publish, search, comment/like/bookmark, and orchestrated workflows like trend-tracking — by driving the user's real Chrome session through a paired browser extension. No XHS API key, no encryption reversal.
    zh: 一组 5 个 OpenClaw / Claude Code 技能：在小红书做登录、发布、搜索、评论 / 点赞 / 收藏 + 复合运营（追热点、竞品、批量互动）。通过自带的 Chrome 扩展驱动你自己的真实小红书账号，不需要 XHS API key，也不用逆向加密。
  best_for:
    en: Xiaohongshu creators or operators who already manage a real account in Chrome and want an AI agent (Claude Code / OpenClaw) to drive search, publish, and engagement workflows — willing to give the paired extension `debugger` + `cookies` permissions on xiaohongshu.com.
    zh: 已经有真实小红书账号、希望让 AI agent（Claude Code / OpenClaw）帮你跑搜索、发布、互动工作流的运营 / 创作者；接受配套 Chrome 扩展拿 `debugger` + `cookies` 权限。
  watch_out:
    en: |
      The Chrome extension requires `debugger`, `cookies`, and `scripting` permissions on xiaohongshu.com — a real privilege escalation. Anyone evaluating this for production use should read manifest.json before installing, and pin the source commit. README itself recommends rate-limiting because XHS does run anti-automation; "use real account" mode is more humane than headless scraping but still violates the platform ToS in spirit, and your account is at risk if you move too fast. Root SKILL.md homepage points to a different repo (xpzouying/xiaohongshu-skills) — origin attribution is fuzzy.
    zh: |
      Chrome 扩展需要 `debugger` + `cookies` + `scripting` 三项高权限并绑定 xiaohongshu.com — 真实的权限升级。生产用前先读 manifest.json，并锁定 commit。README 自己也建议控制速率：XHS 有反自动化检测；用「真实账号」模式比 headless 爬取温和，但精神上仍违反平台 ToS，太频繁会让账号受限。根 SKILL.md 的 homepage 指向另一个 repo (xpzouying/xiaohongshu-skills) —— 来源归属不太清晰。
  use_for:
  - en: Xiaohongshu (XHS) creators / operators who already manage a real account in Chrome.
    zh: 已经在 Chrome 里维护真实小红书账号的创作者 / 运营者。
  - en: Want an AI agent (Claude Code / OpenClaw) to drive search, publish, and engagement workflows.
    zh: 想让 AI agent（Claude Code / OpenClaw）跑搜索、发布、互动工作流。
  dont_use_for:
  - en: Don't install without first reading extension/manifest.json — it asks for `debugger`, `cookies`, `scripting` on xhs.com (privilege escalation).
    zh: 装之前一定先读 extension/manifest.json —— 它在 xhs.com 上要 `debugger` + `cookies` + `scripting`，是真实权限升级。
  - en: Don't run aggressive request rates — XHS anti-automation can limit your account.
    zh: 请求频率别太高 —— 小红书反自动化会限你的账号。
  - en: Don't pin to main without locking a commit; routing logic and platform code change frequently.
    zh: 别直接跟 main —— 锁定具体 commit；路由逻辑和平台代码经常变。
  persona:
    en: Xiaohongshu solo creator or small-team operator who already runs a real account in Chrome and wants an AI agent to handle the boring half — search trends, publish drafts, like/comment/bookmark — while the human stays in charge of taste and escalations.
    zh: 已经在 Chrome 里跑真实小红书账号的个人创作者 / 小团队运营。想让 AI agent 接管「无聊那一半」—— 搜热点、发草稿、点赞评论收藏 —— 自己掌控选题和重要决策。
  scenario:
    en: You want to tell your agent "find the top assassin's-creed image notes, bookmark them and tell me what they're about" and have it actually search XHS, filter to image notes, sort by likes, bookmark, fetch detail, and summarize — without you opening 20 tabs by hand.
    zh: 你想跟 agent 说「找刺客信条最火的图文，收藏并告诉我讲了什么」，然后它真的会去搜小红书、筛图文、按点赞排序、收藏、拉详情、做总结 —— 不用你自己开 20 个 tab 手动操作。
  without_this:
    en: You either click around XHS by hand for an hour every day, or you write a brittle Selenium / Playwright scraper that breaks every time XHS ships UI changes, or you reverse-engineer XHS's signed APIs and live with the cat-and-mouse.
    zh: 要么每天手点小红书一小时，要么写脆弱的 Selenium / Playwright 爬虫（XHS 一改 UI 就坏），要么去逆向 XHS 的签名 API 跟平台玩猫鼠游戏。
  with_this:
    en: One `uv sync` + load the unpacked Chrome extension, then talk to your AI agent in natural language. The agent routes intent across 5 sub-skills (auth/publish/explore/interact/content-ops) and operates inside your real logged-in browser, not a headless puppet.
    zh: 一次 `uv sync` + 加载 unpacked Chrome 扩展，然后用自然语言跟 AI agent 说话。Agent 会把意图分发到 5 个子技能（auth/publish/explore/interact/content-ops），全部在你真实登录的浏览器里执行，不是 headless 木偶。
  cost_summary:
    en: Free OSS (MIT). Need Python 3.11+, uv, Chrome with the unpacked XHS Bridge extension loaded, and a real XHS account. Agent-side LLM cost is on you (Anthropic Claude / OpenClaw provider).
    zh: 开源免费（MIT）。需要 Python 3.11+、uv、加载了 XHS Bridge 解压扩展的 Chrome、一个真实 XHS 账号。Agent 端 LLM 成本自付（Anthropic Claude / OpenClaw 提供商）。
  how:
    en: |
      1. Download ZIP / `git clone` into your agent skills dir (e.g. `.claude/skills/xiaohongshu-skills/`)
      2. `cd xiaohongshu-skills && uv sync`
      3. Open `chrome://extensions/`, enable Developer Mode, "Load unpacked" → select the `extension/` folder; confirm "XHS Bridge" is enabled
      4. In your AI agent (Claude Code / OpenClaw), prompt: "登录小红书" or "搜索关于露营的笔记"
      5. (optional CLI) `python scripts/cli.py check-login` for direct invocation outside an agent
    zh: |
      1. 下载 ZIP / `git clone` 到 agent 的 skills 目录（如 `.claude/skills/xiaohongshu-skills/`）
      2. `cd xiaohongshu-skills && uv sync`
      3. 打开 `chrome://extensions/`，开启开发者模式，「加载已解压的扩展程序」→ 选 `extension/` 目录；确认 XHS Bridge 已启用
      4. 在 AI agent（Claude Code / OpenClaw）里说：「登录小红书」或「搜索关于露营的笔记」
      5. （可选 CLI）`python scripts/cli.py check-login` 在 agent 之外直接调用
  examples:
  - context:
      en: Trend research — find what's hot on XHS for a topic and bookmark the top one
      zh: 选题研究 —— 找小红书某话题的爆款并收藏 top 1
    you_say:
      en: "搜索刺客信条最火的图文帖子，收藏它，然后告诉我讲了什么"
      zh: "搜索刺客信条最火的图文帖子，收藏它，然后告诉我讲了什么"
    what_happens:
      en: "Agent chains xhs-explore (search → filter image notes → sort by likes) → xhs-interact (favorite) → xhs-explore (get-feed-detail) → returns a summary. All inside your real logged-in Chrome."
      zh: "Agent 串：xhs-explore（搜索 → 筛图文 → 按点赞排序）→ xhs-interact（收藏）→ xhs-explore（拉详情）→ 给出摘要。全程在你真实登录的 Chrome 里完成。"
  - context:
      en: Content publishing — post an image note with title + captions + tags
      zh: 内容发布 —— 发图文笔记 + 标题 + 文案 + 标签
    you_say:
      en: "帮我发一条图文笔记，标题是… 配图是 /abs/path/pic1.jpg /abs/path/pic2.jpg"
      zh: "帮我发一条图文笔记，标题是… 配图是 /abs/path/pic1.jpg /abs/path/pic2.jpg"
    what_happens:
      en: "Agent calls xhs-publish: fills title + content, attaches images, optionally previews, then triggers click-publish. CLI equivalent: `python scripts/cli.py publish --title-file ... --images ...`."
      zh: "Agent 调用 xhs-publish：填标题 + 文案、传图、可预览，最后点发布。CLI 对应：`python scripts/cli.py publish --title-file ... --images ...`。"
  - context:
      en: Engagement loop — like + comment on a curated list of competitor notes
      zh: 互动循环 —— 在竞品笔记列表上点赞 + 评论
    you_say:
      en: "搜索竞品账号最近的爆款，挑 5 篇点赞，并写真诚一点的评论"
      zh: "搜索竞品账号最近的爆款，挑 5 篇点赞，并写真诚一点的评论"
    what_happens:
      en: "Agent uses xhs-content-ops to orchestrate: explore → rank → for each: interact (like) + interact (post-comment with tailored text). Slow it down — XHS rate-limits aggressive runs."
      zh: "Agent 用 xhs-content-ops 编排：explore → 排序 → 逐条：interact（点赞）+ interact（写评论）。速度放慢 —— XHS 会限速过快的批量。"
  next_step:
    en: |
      Three actions to lift the score: (a) record an end-to-end session log (search → bookmark → summarize) as evidence so claim-006 can move from `untested` to `passed` — currently the molecule live layer is unverified; (b) document the privileged Chrome permissions in README explicitly (manifest asks for `debugger`/`cookies`/`scripting` but README only hand-waves about real-account mode); (c) clarify the homepage attribution — root SKILL.md points to xpzouying/xiaohongshu-skills, which confuses provenance.
    zh: |
      三个加分动作：(a) 录一段端到端 session 日志（搜索 → 收藏 → 摘要）作为证据，让 claim-006 从 `untested` 升到 `passed` —— 目前 molecule live 层无验证；(b) 在 README 里明确扩展拿了 `debugger`/`cookies`/`scripting` 这些高权限（manifest 写了但 README 只是含糊提了「真实账号模式」）；(c) 修正主页归属 —— 根 SKILL.md 的 homepage 指向 xpzouying/xiaohongshu-skills，让来源不清。
