workflow_diagram:
  layout: tree
  why_layer:
    en: |
      Molecule — root SKILL.md routes to 5 atomic sub-skills (auth / publish / explore / interact / content-ops) by predefined matching. Routing is contract-driven, not LLM-runtime dispatch.
    zh: |
      Molecule —— 根 SKILL.md 按预定义规则路由到 5 个原子子技能（auth / publish / explore / interact / content-ops）。是契约驱动的路由，不是 LLM-runtime dispatch。
  nodes:
  - id: agent
    type: start
    rank: 0
    lane: 0
    label:
      en: "Natural-language\nintent (Claude Code\n/ OpenClaw)"
      zh: "自然语言意图\n(Claude Code\n/ OpenClaw)"
  - id: root
    type: atom
    rank: 1
    lane: 0
    label:
      en: "Root SKILL.md\n(intent router)"
      zh: "根 SKILL.md\n(意图路由)"
  - id: auth
    type: atom
    rank: 2
    lane: 0
    label:
      en: "xhs-auth\n(login / status)"
      zh: "xhs-auth\n(登录 / 状态)"
  - id: explore
    type: atom
    rank: 2
    lane: 1
    label:
      en: "xhs-explore\n(search / detail)"
      zh: "xhs-explore\n(搜索 / 详情)"
  - id: publish
    type: atom
    rank: 2
    lane: 2
    label:
      en: "xhs-publish\n(image / video)"
      zh: "xhs-publish\n(图文 / 视频)"
  - id: interact
    type: atom
    rank: 2
    lane: 3
    label:
      en: "xhs-interact\n(like / comment\n/ bookmark)"
      zh: "xhs-interact\n(点赞 / 评论\n/ 收藏)"
  - id: ops
    type: atom
    rank: 2
    lane: 4
    label:
      en: "xhs-content-ops\n(compound flows)"
      zh: "xhs-content-ops\n(复合运营)"
  - id: bridge
    type: end
    rank: 3
    lane: 2
    label:
      en: "XHS Bridge\nChrome ext.\n→ real account"
      zh: "XHS Bridge\nChrome 扩展\n→ 真实账号"
  edges:
  - {from: agent, to: root}
  - {from: root, to: auth}
  - {from: root, to: explore}
  - {from: root, to: publish}
  - {from: root, to: interact}
  - {from: root, to: ops}
  - {from: auth, to: bridge}
  - {from: explore, to: bridge}
  - {from: publish, to: bridge}
  - {from: interact, to: bridge}
  - {from: ops, to: bridge}
