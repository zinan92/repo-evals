- slug: zinan92--repo-evals
  shared_purpose:
    en: 'Both are personal-toolkit Python frameworks by the same author (zinan92), MIT-leaning even when LICENSE is absent (in the case of repo-evals it was added; doc-driven still missing). Both are molecule-layer pipelines: a fixed sequence of scripts + a hand-authored spec + a rendered output. Both treat the dossier / task folder as the durable artefact.'
    zh: '都是同一作者(zinan92)的个人工具箱型 Python 框架,倾向 MIT 即使 LICENSE 缺失(repo-evals 已经补上,doc-driven 还没)。都是分子层流水线: 固定的脚本顺序 + 手写规范 + 渲染产物。都把 dossier / task 文件夹作为持久产物。'
  this_better_at:
    en: Application breadth — manages real ongoing dev work (Stripe integration, refactor, migration), not just one-shot evaluations. Has a live React dashboard for watching tasks. Targets "the act of building software" — broader scope than evaluation.
    zh: 应用广度 —— 管理真正在进行的开发工作(Stripe 集成 / 重构 / 迁移),不是一次性评测。有 React dashboard 实时看任务。瞄准"做软件这件事" —— 范围比评测更广。
  other_better_at:
    en: Maturity + cross-comparison. repo-evals has 30+ evaluated repos, scoring model with auditable breakdown, similar-repos cross-comparison. It's been used to evaluate this very repo. doc-driven is fresh; repo-evals is in active corpus-building mode.
    zh: 成熟度 + 横向对比。repo-evals 有 30+ 已评测仓库、有可审计明细的评分模型、有 similar-repos 横向对比。它被用来评测这个仓库。doc-driven 是新生,repo-evals 在积极建语料库。
- slug: anthropics--skill-creator
  shared_purpose:
    en: Both formalise an opinionated process — skill-creator for skill-authoring, doc-driven for general dev workflow. Both reject "just do it ad-hoc" in favour of a measurable / auditable process the agent follows.
    zh: 都把一套有偏好的流程形式化 —— skill-creator 给 skill 写作,doc-driven 给一般开发流程。都拒绝"随便干"换成 agent 可遵循的可测量 / 可审计流程。
  this_better_at:
    en: Generality — works on any feature / refactor / migration, not just skill authoring. Includes the human-in-the-loop approval gates explicitly; skill-creator is more "the agent runs the loop" oriented.
    zh: 通用性 —— 任何功能 / 重构 / 迁移都能用,不只 skill 写作。明确包含 human-in-the-loop 审批门;skill-creator 更倾向"agent 自己跑循环"。
  other_better_at:
    en: Production-grade tooling for its specific domain. skill-creator is at 81 / Production-ready (this corpus); doc-driven is at 72 / Available with an honest "untested live e2e" caveat.
    zh: 在自己领域内的生产级工具。skill-creator 在本语料库 81 / 可用于生产;doc-driven 是 72 / 可使用,并有诚实的"端到端未验证"声明。
workflow_diagram:
  layout: linear
  why_layer:
    en: 'Molecule — the 5-phase / 22-stage canonical workflow is a fixed pipeline. Codex and Claude Code play roles within stages (planner / reviewer vs coder), but neither LLM decides at runtime which stage fires next; workflow_guard.py enforces the deterministic transition table. A compound would let the LLM pick branches; doc-driven explicitly denies that.

      '
    zh: '分子 —— 5 阶段 / 22-stage 的 canonical 工作流是固定流水线。Codex 和 Claude Code 在 stage 内承担角色(规划者 / 评审者 vs 程序员),但运行时没有 LLM 决定下一个 stage 触发哪个;workflow_guard.py 强制确定性的迁移表。复合物会让 LLM 选分支;doc-driven 明确拒绝这种做法。

      '
  nodes:
  - id: scaffold
    type: start
    rank: 0
    lane: 0
    label:
      en: 'scaffold_dev_workflow_task

        (creates tasks/TASK-.../)'
      zh: 'scaffold_dev_workflow_task

        (创建 tasks/TASK-.../)'
  - id: research
    type: atom
    rank: 1
    lane: 0
    label:
      en: 'Research phase

        (5 stages, codex)'
      zh: 'Research phase

        (5 stages, codex)'
  - id: design
    type: atom
    rank: 2
    lane: 0
    label:
      en: 'Design phase

        (8 stages, codex)'
      zh: 'Design phase

        (8 stages, codex)'
  - id: development
    type: atom
    rank: 3
    lane: 0
    label:
      en: 'Development phase

        (4 stages, claude code)'
      zh: 'Development phase

        (4 stages, claude code)'
  - id: packaging
    type: atom
    rank: 4
    lane: 0
    label:
      en: 'Packaging phase

        (codex review + ship)'
      zh: 'Packaging phase

        (codex 复审 + 出货)'
  - id: maintenance
    type: end
    rank: 5
    lane: 0
    label:
      en: 'Maintenance phase

        (status: done + backlog)'
      zh: 'Maintenance phase

        (状态: 完成 + backlog)'
  edges:
  - from: scaffold
    to: research
  - from: research
    to: design
  - from: design
    to: development
  - from: development
    to: packaging
  - from: packaging
    to: maintenance
