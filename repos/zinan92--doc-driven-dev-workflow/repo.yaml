    en: Audit trail + state machine + approval gates. Every transition is enforced by code (workflow_guard.py), every decision lives in decision-log.md, every event in run-log.jsonl. When you need to prove "what happened on stage 7", the evidence is on disk, not in chat scrollback. Plus a real observer dashboard.
    zh: 审计轨迹 + 状态机 + 审批门。每一个状态迁移由代码(workflow_guard.py)强制,每个决策落在 decision-log.md,每个事件在 run-log.jsonl。你想证明"第 7 步发生了什么",证据在磁盘上不在聊天 scrollback 里。还有真实的观测 dashboard。
