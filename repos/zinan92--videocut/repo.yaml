workflow_diagram:
  layout: linear
  why_layer:
    en: |
      Molecule — 7 atoms (cut / subtitle / quote / split / cover / speed / pipeline-orchestrator) wired by pipeline.js. No LLM decides which step fires next at runtime; the pipeline.js order is fixed. Claude is the AI primitive *inside* steps, not the routing decision.
    zh: |
      分子 —— 7 个原子(剪 / 字幕 / 金句 / 拆条 / 封面 / 变速 / pipeline 编排) 由 pipeline.js 串起。运行时没有 LLM 决定下一步走哪;pipeline.js 顺序固定。Claude 是 step 内部的 AI primitive,不做路由决策。
  nodes:
  - id: input
    type: start
    rank: 0
    lane: 0
    label:
      en: |-
        Talking-head .mp4
        (5-15 min)
      zh: |-
        口播 .mp4
        (5-15 分钟)
  - id: cut
    type: atom
    rank: 1
    lane: 0
    label:
      en: |-
        Cut filler words
        (Claude + ffmpeg)
      zh: |-
        去废话
        (Claude + ffmpeg)
  - id: subtitle
    type: atom
    rank: 2
    lane: 0
    label:
      en: |-
        Subtitle (Whisper)
        → .srt
      zh: |-
        字幕 (Whisper)
        → .srt
  - id: quote
    type: atom
    rank: 3
    lane: 0
    label:
      en: |-
        Quote extraction
        (Claude picks)
      zh: |-
        金句提取
        (Claude 选)
  - id: split
    type: atom
    rank: 4
    lane: 0
    label:
      en: |-
        Chapter split
        (semantic boundary)
      zh: |-
        拆条
        (语义切分)
  - id: cover
    type: atom
    rank: 5
    lane: 0
    label:
      en: |-
        Cover cards
        (frame pick + text)
      zh: |-
        封面卡片
        (选帧 + 文字)
  - id: speed
    type: atom
    rank: 6
    lane: 0
    label:
      en: |-
        Speed-adjusted
        (ffmpeg pts)
      zh: |-
        变速版
        (ffmpeg pts)
  - id: out
    type: end
    rank: 7
    lane: 0
    label:
      en: |-
        7 artifacts
        (mp4 + srt + dirs)
      zh: |-
        7 个产物
        (mp4 + srt + 目录)
  edges:
  - {from: input, to: cut}
  - {from: cut, to: subtitle}
  - {from: subtitle, to: quote}
  - {from: quote, to: split}
  - {from: split, to: cover}
  - {from: cover, to: speed}
  - {from: speed, to: out}
