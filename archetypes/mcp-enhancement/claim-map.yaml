# Starter claim map for an mcp-enhancement archetype.
# An mcp-enhancement repo wraps an MCP server (or a set of them) with
# workflow guidance — typically a SKILL.md that orchestrates MCP tool calls.
# Split claims into MCP-layer (the underlying tools) and SKILL-layer (the
# orchestration the repo adds on top).

claims:
  # --- MCP layer (the wrapped server) ------------------------------------

  - id: claim-001
    user_icon: "🔌"
    user_title:
      en: "MCP server is reachable from a fresh agent"
      zh: "新 agent 第一次连 MCP 就能连上"
    user_description:
      en: "On a fresh agent host (no cached tokens), the documented MCP connection steps work end-to-end. Server responds to tools/list with the expected tool surface."
      zh: "全新 agent 主机（没缓存 token）按文档步骤连，能连上。Server 对 tools/list 返回预期的工具集。"
    title: MCP server 可达 + 工具面齐全
    source: README
    source_ref: "MCP setup section"
    priority: critical
    area: mcp-connectivity
    statement: |
      在干净 agent 环境里按 README 配置 MCP server，tools/list 返回的
      工具列表与 README 声称的工具列表完全对齐。
    evidence_needed: |
      MCP 配置 + tools/list 输出 + 工具名对照表。
    status: untested

  - id: claim-002
    user_icon: "🛠"
    user_title:
      en: "Each documented MCP tool actually executes"
      zh: "文档列出的每个 MCP 工具都能跑"
    user_description:
      en: "Every MCP tool advertised in the README runs to a successful response with one realistic input. No 'listed but stubbed' tools."
      zh: 'README 列出的每个 MCP 工具都能用一个真实输入跑出成功响应。没有"列了但 stub 的"工具。'
    title: 每个 MCP 工具 happy-path 成功
    source: README
    source_ref: "tool catalog section"
    priority: critical
    area: mcp-tool-coverage
    statement: |
      README 列出的每一个 MCP tool 至少能用一个合法输入返回成功响应。
    evidence_needed: |
      每个 tool 的一次成功调用 + 响应样本。
    status: untested

  - id: claim-003
    user_icon: "🔐"
    user_title:
      en: "Auth + scope errors are actionable"
      zh: "鉴权 / scope 错误可操作"
    user_description:
      en: "When the underlying account / scope / token is wrong, the response tells you exactly what's missing — not a vague 500. Users know which credential to refresh."
      zh: "凭证 / scope / token 不对时，响应能告诉你缺什么 —— 不是笼统的 500。用户知道去补哪个凭证。"
    title: 鉴权失败给出可操作错误
    source: README
    source_ref: "auth section"
    priority: high
    area: auth
    statement: |
      过期 token / 缺权限 / 错配 scope 等情境下，MCP 响应包含可操作的
      错误信息（缺什么 scope、去哪刷新 token）。
    evidence_needed: |
      至少一个 auth 失败场景 + 响应文本。
    status: untested

  # --- Skill layer (the orchestration added on top) ----------------------

  - id: claim-101
    user_icon: "📋"
    user_title:
      en: "SKILL.md actually orchestrates the MCP tools"
      zh: "SKILL.md 真的在编排这些 MCP 工具"
    user_description:
      en: "SKILL.md guides the agent to use the right MCP tool for the right step — not just a tool dump. Reading SKILL.md you know which tool is called when."
      zh: "SKILL.md 指引 agent 把对的 MCP 工具用在对的步骤 —— 不是单纯的工具堆砌。读 SKILL.md 能看出哪一步该调哪个工具。"
    title: SKILL.md 编排 MCP 工具调用顺序
    source: SKILL.md
    source_ref: "workflow section"
    priority: critical
    area: skill-orchestration
    statement: |
      SKILL.md 包含具体的工作流（先做什么、再做什么、何时调哪个 MCP
      tool），不是单纯罗列 tools/list。
    evidence_needed: |
      SKILL.md 工作流段落 + 每步对应的 MCP tool 引用。
    status: untested

  - id: claim-102
    user_icon: "🧪"
    user_title:
      en: "Real LLM run completes the documented workflow"
      zh: "真 LLM 跑一次完整工作流"
    user_description:
      en: "In a real agent session with the MCP attached, run a README-promised workflow end-to-end. Final output meets SKILL.md's quality contract — not a fallback."
      zh: "在真实 agent 会话里挂上 MCP，跑一次 README 承诺的端到端工作流。最终产物符合 SKILL.md 的质量契约 —— 不是 fallback。"
    title: 真实 LLM + MCP 端到端工作流跑通
    source: SKILL.md + README
    source_ref: "end-to-end example"
    priority: critical
    area: end-to-end-llm-mcp
    statement: |
      在真实 agent 会话里挂载 MCP，按 SKILL.md 跑 README 承诺的端到端
      工作流，最终产物符合 SKILL.md 的质量契约。
    evidence_needed: |
      transcript + MCP tool 调用日志 + 最终产物文件。
    status: untested

  - id: claim-103
    user_icon: "🔗"
    user_title:
      en: "SKILL references all resolve"
      zh: "SKILL 引用都打得开"
    user_description:
      en: "Every relative path SKILL.md mentions points to a file that exists. The LLM won't hallucinate when a referenced file is missing."
      zh: "SKILL.md 引用的每个相对路径都真实存在。LLM 不会因为找不到文件就开始瞎编。"
    title: SKILL.md 引用全部解析得到
    source: SKILL.md
    source_ref: ""
    priority: medium
    area: skill-integrity
    statement: |
      SKILL.md 中引用的每一个相对路径都指向真实存在的文件。
    evidence_needed: |
      grep + 文件存在列表。
    status: untested
